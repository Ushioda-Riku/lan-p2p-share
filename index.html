        const plain = await decryptControlPacket(bytes);
        const jsonStart = plain[0] === 0x01 ? 1 : 0;
        await handleControlJson(JSON.parse(textDecoder.decode(plain.subarray(jsonStart))), "relay");
        drainEarlyRelayChunks();
      })
      .catch(() => {});
    return;
  }

  if (frameType >= 0x02 && frameType <= 0x06) {
    if (bytes.length < HEADER_LEN) return;
    const txSlot = bytes[1];
    const transferId = txSlot > 0 ? txSlotMap.get(txSlot) : null;
    const state = transferId ? incomingTransfers.get(transferId) : (txSlot === 0 ? getRecvState(null) : null);
    if (!state || !state.salt) {
      if (earlyRelayChunks.length < 512) earlyRelayChunks.push(bytes.slice());
      return;
    }
    const seq = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength).getUint32(4, false);
    if (frameType === 0x06) {
      const g = seq >>> 4;
      if (state.fecParity.has(g) || isFecGroupComplete(state, g)) return;
    } else if (seq >= state.totalChunks || hasRecvBit(state, seq)) {
      noteDuplicatePacket(state, "relay");
      return;
    }
    decodeEncryptedDataPacket(state, bytes, "relay");
  }
}

function finishPendingDecode(state) {
  state.pendingDecodes -= 1;
  if (state.pendingDecodes === 0 && state.decodeDrainResolve) {
    const fn = state.decodeDrainResolve;
    state.decodeDrainResolve = null;
    fn();
  }
}

function decodeEncryptedDataPacket(state, bytes, transport) {
  state.pendingDecodes += 1;
  if (rxWorkers.length > 0 && transport === "relay") {
    const wEntry = rxWorkers[0].busy <= rxWorkers[1].busy ? rxWorkers[0] : rxWorkers[1];
    const id = nextRxJobId++;
    const pktAb = bytes.slice().buffer;
    const saltAb = state.salt.slice().buffer;
    wEntry.busy += 1;
    new Promise((resolve, reject) => {
      rxWorkerPending.set(id, { resolve, reject });
      wEntry.worker.postMessage({ op: "decodeRelay", id, pktAb, saltAb }, [pktAb, saltAb]);
    })
      .then((res) => {
        if (res.frameType === 0x06) {
          handleDecodedFecParity(state, res.seq >>> 4, new Uint8Array(res.chunkAb), transport);
        } else {
          handleDecodedChunk(state, res.seq, res.sentMs32, new Uint8Array(res.chunkAb), transport);
        }
      })
      .catch(() => decryptChunkWithXorNonce(state.salt, bytes)
        .then(({ frameType, seq, sentMs32, body }) => decodeBodyAndApply(state, frameType, seq, sentMs32, body, transport))
        .catch(() => {}))
      .finally(() => finishPendingDecode(state));
    return;
  }
  decryptChunkWithXorNonce(state.salt, bytes)
    .then(({ frameType, seq, sentMs32, body }) => decodeBodyAndApply(state, frameType, seq, sentMs32, body, transport))
    .catch(() => {})
    .finally(() => finishPendingDecode(state));
}

function drainEarlyRelayChunks() {
  if (earlyRelayChunks.length === 0) return;
  const remaining = [];
  while (earlyRelayChunks.length > 0) {
    const bytes = earlyRelayChunks.shift();
    const frameType = bytes[0];
    const txSlot = bytes[1];
    const transferId = txSlot > 0 ? txSlotMap.get(txSlot) : null;
    const state = transferId ? incomingTransfers.get(transferId) : (txSlot === 0 ? getRecvState(null) : null);
    if (!state || !state.salt) {
      remaining.push(bytes);
      continue;
    }
    const seq = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength).getUint32(4, false);
    if (frameType === 0x06) {
      const g = seq >>> 4;
      if (state.fecParity.has(g) || isFecGroupComplete(state, g)) continue;
    } else if (seq >= state.totalChunks || hasRecvBit(state, seq)) {
      noteDuplicatePacket(state, "relay");
      continue;
    }
    decodeEncryptedDataPacket(state, bytes, "relay");
  }
  for (const r of remaining) earlyRelayChunks.push(r);
}

function applyP2PDataPacket(state, bytes) {
  const frameType = bytes[0];
  const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  const seq = view.getUint32(4, false);
  const sentMs32 = view.getUint32(8, false);
  if (frameType !== 0x06 && (seq >= state.totalChunks || hasRecvBit(state, seq))) {
    noteDuplicatePacket(state, "p2p");
    return;
  }
  const body = bytes.subarray(HEADER_LEN);
  if (frameType !== 0x03) {
    decodeBodySyncOrAsync(state, frameType, seq, sentMs32, body, "p2p");
  } else {
    state.pendingDecodes += 1;
    decodeBodyAndApply(state, frameType, seq, sentMs32, body, "p2p")
      .catch(() => {})
      .finally(() => finishPendingDecode(state));
  }
}

function drainEarlyP2PChunks() {
  if (earlyP2PChunks.length === 0) return;
  const remaining = [];
  while (earlyP2PChunks.length > 0) {
    const bytes = earlyP2PChunks.shift();
    const txSlot = bytes[1];
    const transferId = txSlot > 0 ? txSlotMap.get(txSlot) : null;
    const state = transferId ? incomingTransfers.get(transferId) : (txSlot === 0 ? getRecvState(null) : null);
    if (!state) {
      remaining.push(bytes);
      continue;
    }
    applyP2PDataPacket(state, bytes);
  }
  for (const r of remaining) earlyP2PChunks.push(r);
}

function handleP2PRawPacket(bytes) {
  if (!bytes || bytes.length === 0) return;
  const frameType = bytes[0];

  if (frameType === 0x01) {
    const msg = JSON.parse(textDecoder.decode(bytes.subarray(1)));
    handleControlJson(msg, "p2p");
    return;
  }

  if (frameType >= 0x02 && frameType <= 0x05) {
    if (bytes.length < HEADER_LEN) return;
    const txSlot = bytes[1];
    const transferId = txSlot > 0 ? txSlotMap.get(txSlot) : null;
    const state = transferId ? incomingTransfers.get(transferId) : (txSlot === 0 ? getRecvState(null) : null);
    if (!state) {
      if (earlyP2PChunks.length < 512) earlyP2PChunks.push(bytes.slice());
      return;
    }
    applyP2PDataPacket(state, bytes);
  }
}

function decodeBodySyncOrAsync(state, frameType, seq, sentMs32, body, transport) {
  if (!state || state.finalized) return;
  if (frameType === 0x06) {
    handleDecodedFecParity(state, seq >>> 4, body, transport);
    return;
  }
  if (seq >= state.totalChunks) return;
  let chunk;
  if (frameType === 0x02) {
    chunk = body;
  } else if (frameType === 0x05) {
    try {
      chunk = lz4DecompressBlock(body);
    } catch {
      return;
    }
  } else if (frameType === 0x04) {
    if (body.length < 5) return;
    const fillByte = body[0];
    const len = new DataView(body.buffer, body.byteOffset, body.byteLength).getUint32(1, false);
    chunk = new Uint8Array(len);
    if (fillByte !== 0) chunk.fill(fillByte);
  } else if (frameType === 0x03) {
    return runStreamTransform(body, DecompressionStream)
      .then((c) => handleDecodedChunk(state, seq, sentMs32, c, transport));
  } else {
    return;
  }
  handleDecodedChunk(state, seq, sentMs32, chunk, transport);
}

async function decodeBodyAndApply(state, frameType, seq, sentMs32, body, transport) {
  const res = decodeBodySyncOrAsync(state, frameType, seq, sentMs32, body, transport);
  if (res && typeof res.then === "function") await res;
}

function getRecvState(transferId) {
  if (transferId && incomingTransfers.has(transferId)) return incomingTransfers.get(transferId);
  if (legacyRecvId && incomingTransfers.has(legacyRecvId)) return incomingTransfers.get(legacyRecvId);
  return null;
}

function hasRecvBit(state, seq) {
  if (seq < 0 || seq >= state.totalChunks) return false;
  return (state.bitmap[seq >>> 3] & (1 << (seq & 7))) !== 0;
}

function setRecvBit(state, seq) {
  state.bitmap[seq >>> 3] |= (1 << (seq & 7));
}

function compactContiguousPrefix(state) {
  while (state.cumSeq - state.compactWatermark + 1 >= COMPACT_CHUNK_BATCH) {
    const end = state.compactWatermark + COMPACT_CHUNK_BATCH;
    const slice = [];
    for (let i = state.compactWatermark; i < end; i++) {
      if (state.chunks[i]) {
        slice.push(state.chunks[i]);
        state.chunks[i] = null;
      }
    }
    if (slice.length > 0) {
      state.compactedBlobs.push(new Blob(slice));
    }
    state.compactWatermark = end;
  }
}

function emitSack(state, transport) {
  const now = nowMs();
  let lo = 0;
  let hi = 0;
  for (let bit = 0; bit < 64; bit++) {
    const s = state.cumSeq + 1 + bit;
    if (s >= state.totalChunks) break;
    if (hasRecvBit(state, s)) {
      if (bit < 32) lo |= (1 << bit);
      else hi |= (1 << (bit - 32));
    }
  }
  state.lastSackAt = now;
  const rxBudget = transport === "p2p" ? 192 : 96;
  const grantWindow = Math.max(24, rxBudget - state.pendingDecodes * 2);
  const grantSeq = state.totalChunks > 0
    ? Math.min(state.totalChunks - 1, Math.max(-1, state.cumSeq) + grantWindow)
    : -1;
  sendControlMessage({
    type: "sack",
    transferId: state.meta.transferId,
    cumSeq: state.cumSeq,
    bitmapHi: hi >>> 0,
    bitmapLo: lo >>> 0,
    grantSeq,
    echoTs: state.lastSenderTs || 0
  }, transport === "p2p");
}

async function handleControlJson(msg, transport) {
  if (msg.type === "sack" || msg.type === "chunk-ack") {
    const tx = outgoingTransfers.get(msg.transferId);
    if (tx && typeof tx.onSack === "function") {
      tx.onSack(msg);
    } else if (tx && tx.resolveDone) {
      tx.resolveDone();
    }
    return;
  }

  if (msg.type === "resume-query") {
    const state = incomingTransfers.get(msg.transferId);
    if (state) emitSack(state, transport);
    return;
  }

  if (msg.type === "file-start") {
    if (incomingTransfers.has(msg.transferId)) return;
    const totalChunks = typeof msg.totalChunks === "number"
      ? msg.totalChunks
      : (msg.size === 0 ? 0 : Math.ceil(msg.size / (msg.chunkSize || RELAY_CHUNK_SIZE)));
    const state = {
      meta: msg,
      salt: msg.saltB64 ? base64ToBytes(msg.saltB64) : null,
      totalChunks,
      chunks: new Array(totalChunks),
      compactedBlobs: [],
      compactWatermark: 0,
      bitmap: new Uint8Array(Math.ceil(totalChunks / 8)),
      fecParity: new Map(),
      receivedCount: 0,
      receivedBytes: 0,
      cumSeq: -1,
      pendingDecodes: 0,
      decodeDrainResolve: null,
      startedAt: nowMs(),
      lastSackAt: 0,
      lastSenderTs: 0,
      sinceSack: 0,
      finalized: false
    };
    incomingTransfers.set(msg.transferId, state);
    if (typeof msg.txSlot === "number") txSlotMap.set(msg.txSlot, msg.transferId);
    legacyRecvId = msg.transferId;

    document.getElementById("recvProgressBox").style.display = "block";
    scheduleRecvUi(msg.name, 0, msg.size, state.startedAt);
    drainEarlyP2PChunks();
    drainEarlyRelayChunks();
    return;
  }

  if (msg.type === "file-end") {
    const state = getRecvState(msg.transferId);
    if (!state || state.finalized) return;
    if (state.pendingDecodes > 0) {
      await new Promise((resolve) => { state.decodeDrainResolve = resolve; });
    }
    if (state.finalized) return;
    state.finalized = true;

    const parts = state.compactedBlobs.slice();
    for (let i = state.compactWatermark; i < state.totalChunks; i++) {
      if (state.chunks[i]) {
        parts.push(state.chunks[i]);
        state.chunks[i] = null;
      }
    }
    const blob = new Blob(parts, { type: state.meta.mime || "application/octet-stream" });
    addFileToList(state.meta.name, state.meta.size, state.meta.mime, blob, "受信");

    incomingTransfers.delete(state.meta.transferId);
    if (typeof state.meta.txSlot === "number" && txSlotMap.get(state.meta.txSlot) === state.meta.transferId) {
      txSlotMap.delete(state.meta.txSlot);
    }
    if (legacyRecvId === state.meta.transferId) legacyRecvId = null;

    scheduleRecvUi(state.meta.name, state.meta.size, state.meta.size, state.startedAt);
    setTimeout(() => { document.getElementById("recvProgressBox").style.display = "none"; }, 1400);
  }
}

function expectedChunkLen(state, seq) {
  const cs = state.meta.chunkSize || RELAY_CHUNK_SIZE;
  return seq === state.totalChunks - 1 ? Math.max(0, state.meta.size - seq * cs) : cs;
}

function isFecGroupComplete(state, g) {
  const gStart = g << 4;
  const gEnd = Math.min(state.totalChunks, gStart + FEC_GROUP_SIZE);
  for (let s = gStart; s < gEnd; s++) {
    if (!hasRecvBit(state, s)) return false;
  }
  return true;
}

function tryRecoverFecGroup(state, g, transport) {
  if (!state || state.finalized) return;
  const parity = state.fecParity.get(g);
  if (!parity) return;
  const gStart = g << 4;
  const gEnd = Math.min(state.totalChunks, gStart + FEC_GROUP_SIZE);
  const gCount = gEnd - gStart;
  if (gCount < 2) {
    state.fecParity.delete(g);
    return;
  }
  let missingSeq = -1;
  let haveCount = 0;
  for (let s = gStart; s < gEnd; s++) {
    if (hasRecvBit(state, s)) {
      if (!state.chunks[s]) return;
      haveCount += 1;
    } else {
      missingSeq = s;
    }
  }
  if (haveCount === gCount) {
    state.fecParity.delete(g);
    return;
  }
  if (missingSeq >= 0 && haveCount === gCount - 1) {
    const rec = parity.slice();
    for (let s = gStart; s < gEnd; s++) {
      if (s !== missingSeq && state.chunks[s]) {
        xorInto(rec, state.chunks[s]);
      }
    }
    state.fecParity.delete(g);
    const expLen = expectedChunkLen(state, missingSeq);
    handleDecodedChunk(state, missingSeq, 0, rec.subarray(0, expLen), transport);
  }
}

function handleDecodedFecParity(state, g, parityBuf, transport) {
  if (!state || state.finalized || isFecGroupComplete(state, g)) return;
  if (!state.fecParity.has(g)) {
    state.fecParity.set(g, parityBuf);
  }
  tryRecoverFecGroup(state, g, transport);
}

function handleDecodedChunk(state, seq, sentMs32, chunk, transport) {
  if (!state || state.finalized || seq >= state.totalChunks) return;
  if (sentMs32 > 0) state.lastSenderTs = sentMs32;
  const outOfOrder = seq > state.cumSeq + 1;

  if (!hasRecvBit(state, seq)) {
    state.chunks[seq] = chunk;
    setRecvBit(state, seq);
    state.receivedCount += 1;
    state.receivedBytes += chunk.byteLength;
    while (hasRecvBit(state, state.cumSeq + 1)) {
      state.cumSeq += 1;
    }
    tryRecoverFecGroup(state, seq >>> 4, transport);
    compactContiguousPrefix(state);
    scheduleRecvUi(state.meta.name, state.receivedBytes, state.meta.size, state.startedAt);
  }

  state.sinceSack += 1;
  const now = nowMs();
  if (
    state.receivedCount >= state.totalChunks ||
    (outOfOrder && now - state.lastSackAt > 12) ||
    (state.sinceSack >= SACK_INTERVAL && now - state.lastSackAt > 4)
  ) {
    state.sinceSack = 0;
    emitSack(state, transport);
  }
}

// === History & iOS Share / Save ===
function formatFileSize(bytes) {
  if (bytes < 1024) return `${bytes} B`;
  if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
  return `${(bytes / (1024 * 1024)).toFixed(2)} MB`;
}

function createSvgIcon(symbolId, size = 15) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("class", "svg-icon");
  svg.setAttribute("width", String(size));
  svg.setAttribute("height", String(size));
  svg.setAttribute("aria-hidden", "true");
  const use = document.createElementNS("http://www.w3.org/2000/svg", "use");
  use.setAttribute("href", `#${symbolId}`);
  svg.append(use);
  return svg;
}

function getCanShareFiles() {
  if (canShareFilesCache !== null) return canShareFilesCache;
  try {
    if (typeof File === "function" && navigator.canShare) {
      const probe = new File([new Uint8Array(1)], "p.bin", { type: "application/octet-stream" });
      canShareFilesCache = Boolean(navigator.canShare({ files: [probe] }));
    } else {
      canShareFilesCache = false;
    }
  } catch {
    canShareFilesCache = false;
  }
  return canShareFilesCache;
}

function addFileToList(name, size, mime, blob, statusLabel) {
  document.getElementById("historyCard").classList.remove("hidden");
  const list = document.getElementById("fileList");

  const isSent = statusLabel === "送信";
  const li = document.createElement("li");
  li.className = isSent ? "file-item is-sent" : "file-item is-received";

  const header = document.createElement("div");
  header.className = "file-header";

  const info = document.createElement("div");
  info.className = "file-info";
  const nameDiv = document.createElement("div");
  nameDiv.className = "file-name";
  nameDiv.textContent = name;

  const metaDiv = document.createElement("div");
  metaDiv.className = "file-meta";
  const badge = document.createElement("span");
  badge.className = isSent ? "dir-badge is-sent" : "dir-badge is-recv";
  badge.append(
    createSvgIcon(isSent ? "icon-upload" : "icon-download", 12),
    document.createTextNode(isSent ? "送信済み" : "受信")
  );
  metaDiv.append(badge, document.createTextNode(formatFileSize(size)));
  info.append(nameDiv, metaDiv);

  const actions = document.createElement("div");
  actions.className = "file-actions";

  if (isSent) {
    const checkSpan = document.createElement("span");
    checkSpan.className = "sent-check";
    checkSpan.setAttribute("aria-hidden", "true");
    checkSpan.append(createSvgIcon("icon-check", 16));
    actions.append(checkSpan);
    header.append(info, actions);
    li.append(header);
  } else {
    const url = URL.createObjectURL(blob);
    activeObjectUrls.add(url);
    const isImage = mime && mime.startsWith("image/");

    if (getCanShareFiles()) {
      const shareBtn = document.createElement("button");
      shareBtn.type = "button";
      shareBtn.className = "share-file-btn";
      shareBtn.setAttribute("aria-label", `${name} を共有`);
      shareBtn.append(createSvgIcon("icon-share", 14), document.createTextNode("共有"));
      shareBtn.addEventListener("click", async () => {
        try {
          const shareFile = new File([blob], name, { type: mime || "application/octet-stream" });
          await navigator.share({ files: [shareFile], title: name });
        } catch {}
      });
      actions.append(shareBtn);
    }

    const dlLink = document.createElement("a");
    dlLink.href = url;
    dlLink.download = name;
    dlLink.className = "dl-btn";
    dlLink.setAttribute("aria-label", `${name} を保存`);
    dlLink.append(createSvgIcon("icon-download", 14), document.createTextNode("保存"));
    actions.append(dlLink);

    header.append(info, actions);
    li.append(header);

    if (isImage) {
      const img = document.createElement("img");
      img.src = url;
      img.className = "preview-img";
      img.alt = name;
      img.loading = "lazy";
      img.decoding = "async";
      li.append(img);
    }
  }

  list.prepend(li);
}

// === UI Events & Copy Helper ===
function legacyCopy(text) {
  const previousFocus = document.activeElement;
  const field = Object.assign(document.createElement("textarea"), { value: text });
  field.setAttribute("readonly", "");
  field.style.cssText = "position:fixed;inset-block-start:0;opacity:0";
  document.body.append(field);
  field.select();
  try {
    return document.execCommand("copy");
  } finally {
    field.remove();
    previousFocus?.focus({ preventScroll: true });
  }
}

function showCopyTip(message, ok) {
  const btn = document.getElementById("copyCodeBtn");
  const tip = document.getElementById("copyTip");
  clearTimeout(copyTipTimer);
  let text = message;
  if (text === lastCopyMessage) text += "\u00A0";
  lastCopyMessage = message;
  if (ok) btn.setAttribute("data-copied", "");
  else btn.removeAttribute("data-copied");
  tip.textContent = "";
  tip.classList.add("is-visible");
  requestAnimationFrame(() => { tip.textContent = text; });
  copyTipTimer = setTimeout(() => {
    btn.removeAttribute("data-copied");
    tip.classList.remove("is-visible");
    tip.textContent = "";
  }, 1800);
}

function setupUIEvents() {
  const targetInput = document.getElementById("targetId");
  const connectBtn = document.getElementById("connectBtn");
  const cancelBtn = document.getElementById("cancelConnectBtn");
  const reconnectBtn = document.getElementById("reconnectBtn");
  const disconnectBtn = document.getElementById("disconnectBtn");
  const copyCodeBtn = document.getElementById("copyCodeBtn");
  const shareLinkBtn = document.getElementById("shareLinkBtn");

  if (navigator.share) {
    shareLinkBtn.classList.remove("hidden");
    shareLinkBtn.addEventListener("click", async () => {
      const url = `${window.location.origin}${window.location.pathname}?connect=${myId}`;
      try {
        await navigator.share({ title: "AirShare", text: `コード: ${myId}`, url });
      } catch {}
    });
  }

  copyCodeBtn.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(myId);
      showCopyTip("コピーしました", true);
    } catch {
      const ok = legacyCopy(myId);
      showCopyTip(ok ? "コピーしました" : "コピー失敗", ok);
    }
  });

  targetInput.addEventListener("input", () => {
    const cleaned = normalizeCode(targetInput.value);
    if (targetInput.value !== cleaned) {
      targetInput.value = cleaned;
    }
  });

  connectBtn.addEventListener("click", () => {
    connectToPeer(targetInput.value);
  });

  cancelBtn.addEventListener("click", () => {
    cancelPendingConnection("キャンセルしました", false);
  });

  reconnectBtn.addEventListener("click", () => {
    wakeTransports();
    startAutoReconnect(true);
  });

  disconnectBtn.addEventListener("click", () => {
    if (pairedPeerId && hasAnyMqttReady()) {
      publishOnBestBroker(`lanp2p-v2/inbox/${pairedPeerId}`, JSON.stringify({ kind: "bye", from: myId }), { qos: 1 }).catch(() => {});
    }
    resetToConnectPanel("切断しました");
  });

  targetInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      connectBtn.click();
    }
  });

  const dropZone = document.getElementById("dropZone");
  const fileInput = document.getElementById("fileInput");

  dropZone.addEventListener("click", () => fileInput.click());
  dropZone.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      fileInput.click();
    }
  });

  fileInput.addEventListener("change", (e) => {
    if (e.target.files.length > 0) {
      sendFiles(e.target.files, () => {
        fileInput.value = "";
      });
    }
  });

  dropZone.addEventListener("dragover", (e) => {
    e.preventDefault();
    dropZone.classList.add("dragover");
  });
  dropZone.addEventListener("dragleave", () => dropZone.classList.remove("dragover"));
  dropZone.addEventListener("drop", (e) => {
    e.preventDefault();
    dropZone.classList.remove("dragover");
    if (e.dataTransfer.files.length > 0) sendFiles(e.dataTransfer.files);
  });
}
</script>
</body>
</html>
