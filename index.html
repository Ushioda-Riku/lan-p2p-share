<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>AirShare</title>
  <script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
  <script src="https://unpkg.com/mqtt@5.10.3/dist/mqtt.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --bg-light: #f5f5f7;
      --bg-dark: #000000;
      --card-light: #ffffff;
      --card-dark: #1c1c1e;
      --header-light: rgba(245, 245, 247, 0.82);
      --header-dark: rgba(0, 0, 0, 0.82);
      --fill-light: rgba(120, 120, 128, 0.11);
      --fill-dark: rgba(120, 120, 128, 0.24);
      --text-light: #111111;
      --text-dark: #f5f5f7;
      --subtext-light: rgba(60, 60, 67, 0.62);
      --subtext-dark: rgba(235, 235, 245, 0.6);
      --sep-light: rgba(60, 60, 67, 0.12);
      --sep-dark: rgba(84, 84, 88, 0.42);
      --accent-light: #007aff;
      --accent-dark: #0a84ff;
      --green-light: #28a745;
      --green-dark: #30d158;
      --red-light: #ff3b30;
      --red-dark: #ff453a;
      --amber-light: #ff9500;
      --amber-dark: #ff9f0a;

      --bg: var(--bg-light);
      --card: var(--card-light);
      --header-bg: var(--header-light);
      --fill: var(--fill-light);
      --text: var(--text-light);
      --subtext: var(--subtext-light);
      --sep: var(--sep-light);
      --accent: var(--accent-light);
      --green: var(--green-light);
      --red: var(--red-light);
      --amber: var(--amber-light);
      --target-size: 24px;

      color-scheme: light dark;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: var(--bg-dark);
        --card: var(--card-dark);
        --header-bg: var(--header-dark);
        --fill: var(--fill-dark);
        --text: var(--text-dark);
        --subtext: var(--subtext-dark);
        --sep: var(--sep-dark);
        --accent: var(--accent-dark);
        --green: var(--green-dark);
        --red: var(--red-dark);
        --amber: var(--amber-dark);
      }
    }

    @supports (color: light-dark(white, black)) {
      :root {
        --bg: light-dark(var(--bg-light), var(--bg-dark));
        --card: light-dark(var(--card-light), var(--card-dark));
        --header-bg: light-dark(var(--header-light), var(--header-dark));
        --fill: light-dark(var(--fill-light), var(--fill-dark));
        --text: light-dark(var(--text-light), var(--text-dark));
        --subtext: light-dark(var(--subtext-light), var(--subtext-dark));
        --sep: light-dark(var(--sep-light), var(--sep-dark));
        --accent: light-dark(var(--accent-light), var(--accent-dark));
        --green: light-dark(var(--green-light), var(--green-dark));
        --red: light-dark(var(--red-light), var(--red-dark));
        --amber: light-dark(var(--amber-light), var(--amber-dark));
      }
    }

    @media (pointer: coarse) {
      :root {
        --target-size: 44px;
      }
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Hiragino Sans", "Segoe UI", sans-serif;
      line-height: 1.4;
      overflow-wrap: break-word;
    }

    :where(button, input:not([type="checkbox"], [type="radio"]), [role="button"], .dl-btn) {
      min-block-size: var(--target-size);
      min-inline-size: var(--target-size);
    }

    .svg-icon {
      display: block;
      flex: none;
      pointer-events: none;
    }

    .is-spinning {
      animation: spin 0.9s linear infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      .is-spinning {
        animation: none;
      }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Header */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 20;
      padding: max(12px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px));
      background: var(--header-bg);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 0.5px solid var(--sep);
    }

    .header-inner {
      max-width: 420px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
      text-wrap: balance;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      background: var(--fill);
      color: var(--subtext);
      white-space: nowrap;
    }

    .status-pill .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--amber);
    }

    .status-pill.is-ready .dot {
      background: var(--green);
    }

    .status-pill.is-ready {
      color: var(--text);
    }

    main {
      max-width: 452px;
      margin: 0 auto;
      padding: 16px max(16px, env(safe-area-inset-right, 0px)) max(32px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    }

    .card {
      background: var(--card);
      border: 0.5px solid var(--sep);
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 14px;
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }

    .card h2 {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      color: var(--subtext);
      text-wrap: balance;
    }

    /* Own Code Card */
    .code-row {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .code-box {
      font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
      font-variant-numeric: tabular-nums;
      font-size: 36px;
      font-weight: 700;
      letter-spacing: 8px;
      padding-left: 8px;
      color: var(--text);
      user-select: all;
    }

    .code-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .copy-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
    }

    .pill-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 999px;
      border: 0.5px solid var(--sep);
      background: var(--fill);
      color: var(--accent);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.12s ease;
    }

    .pill-btn:active {
      transform: scale(0.96);
      opacity: 0.75;
    }

    #copyCodeBtn .icon-check {
      display: none;
    }

    #copyCodeBtn[data-copied] .icon-copy {
      display: none;
    }

    #copyCodeBtn[data-copied] .icon-check {
      display: block;
    }

    .copy-tip {
      position: absolute;
      left: 50%;
      bottom: calc(100% + 8px);
      transform: translateX(-50%) translateY(4px);
      background: var(--text);
      color: var(--bg);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.16s ease, transform 0.16s ease;
    }

    .copy-tip.is-visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    #qrcode {
      display: flex;
      justify-content: center;
      align-items: center;
      background: #ffffff;
      padding: 10px;
      border-radius: 14px;
      border: 0.5px solid var(--sep);
      width: fit-content;
      margin: 2px auto 0 auto;
    }

    /* Connect Input */
    .connect-row {
      display: flex;
      gap: 8px;
      align-items: stretch;
    }

    .code-input {
      flex: 1;
      min-width: 0;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1.5px solid transparent;
      background: var(--fill);
      color: var(--text);
      font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
      font-variant-numeric: tabular-nums;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 5px;
      text-align: center;
      outline: none;
      transition: border-color 0.16s ease;
    }

    .code-input:focus {
      border-color: var(--accent);
    }

    .code-input::placeholder {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Hiragino Sans", sans-serif;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0;
      color: var(--subtext);
    }

    .btn-primary, .btn-icon {
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.12s ease, opacity 0.12s ease;
    }

    .btn-primary {
      padding: 0 18px;
      background: var(--accent);
      color: #ffffff;
      white-space: nowrap;
    }

    .btn-icon {
      padding: 0 12px;
      background: var(--fill);
      color: var(--text);
    }

    .btn-icon-danger {
      background: rgba(255, 59, 48, 0.12);
      color: var(--red);
    }

    .btn-primary:active, .btn-icon:active {
      transform: scale(0.97);
      opacity: 0.78;
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: default;
    }

    .status-line {
      margin: 10px 0 0 0;
      font-size: 13px;
      color: var(--subtext);
      text-wrap: pretty;
    }

    .status-line.is-error {
      color: var(--red);
    }

    /* Transfer View */
    .session-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      min-width: 0;
    }

    .peer-id-label {
      font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
      font-variant-numeric: tabular-nums;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    .mode-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      background: var(--fill);
      color: var(--subtext);
    }

    .mode-chip.is-p2p {
      background: rgba(0, 122, 255, 0.13);
      color: var(--accent);
    }

    .mode-chip.is-relay {
      background: rgba(40, 167, 69, 0.13);
      color: var(--green);
    }

    .mode-chip.is-reconnecting {
      background: rgba(255, 149, 0, 0.15);
      color: var(--amber);
    }

    .mode-chip.is-disconnected {
      background: rgba(255, 59, 48, 0.14);
      color: var(--red);
    }

    .session-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #dropZone {
      border: 1.5px dashed var(--sep);
      border-radius: 14px;
      padding: 28px 16px;
      text-align: center;
      cursor: pointer;
      background: var(--fill);
      color: var(--accent);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: border-color 0.16s ease, opacity 0.16s ease, transform 0.12s ease;
    }

    #dropZone:hover, #dropZone:focus-visible {
      border-color: var(--accent);
      outline: none;
    }

    #dropZone.dragover {
      border-color: var(--accent);
      transform: scale(0.99);
    }

    #dropZone.is-disabled {
      opacity: 0.45;
      pointer-events: none;
    }

    .drop-title {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
    }

    .drop-sub {
      display: none;
      margin: 0;
      font-size: 12px;
      color: var(--subtext);
    }

    @media (hover: hover) {
      .drop-sub {
        display: block;
      }
    }

    #fileInput {
      display: none;
    }

    .progress-container {
      display: none;
      margin-top: 14px;
      padding: 12px;
      border-radius: 12px;
      background: var(--fill);
    }

    .status-text {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .status-text span:first-child {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    progress {
      appearance: none;
      border: 0 solid;
      overflow: clip;
      width: 100%;
      height: 6px;
      border-radius: 999px;
      background-color: var(--sep);
    }

    progress::-webkit-progress-bar {
      background-color: transparent;
    }

    progress::-webkit-progress-value {
      background-color: var(--accent);
      border-radius: 999px;
      transition: inline-size 0.15s ease;
    }

    progress::-moz-progress-bar {
      background-color: var(--accent);
      border-radius: 999px;
      transition: inline-size 0.15s ease;
    }

    /* History */
    .file-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .file-item {
      background: var(--fill);
      padding: 12px;
      border-radius: 14px;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .file-item:last-child {
      margin-bottom: 0;
    }

    .file-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .file-info {
      min-width: 0;
      flex: 1 1 160px;
    }

    .file-name {
      font-weight: 600;
      font-size: 14px;
      word-break: break-word;
    }

    .file-meta {
      font-size: 12px;
      color: var(--subtext);
      margin-top: 2px;
    }

    .file-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dl-btn, .share-file-btn {
      border: none;
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .dl-btn {
      background: var(--accent);
      color: #ffffff;
    }

    .share-file-btn {
      background: var(--card);
      color: var(--accent);
      border: 0.5px solid var(--sep);
    }

    .preview-img {
      max-inline-size: 100%;
      block-size: auto;
      max-height: 220px;
      border-radius: 10px;
      object-fit: contain;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <svg hidden aria-hidden="true">
    <symbol id="icon-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <rect x="9" y="9" width="13" height="13" rx="2"/>
      <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
    </symbol>
    <symbol id="icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"/>
    </symbol>
    <symbol id="icon-share" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/>
      <polyline points="16 6 12 2 8 6"/>
      <line x1="12" y1="2" x2="12" y2="15"/>
    </symbol>
    <symbol id="icon-arrow-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="5" y1="12" x2="19" y2="12"/>
      <polyline points="12 5 19 12 12 19"/>
    </symbol>
    <symbol id="icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="18" y1="6" x2="6" y2="18"/>
      <line x1="6" y1="6" x2="18" y2="18"/>
    </symbol>
    <symbol id="icon-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="23 4 23 10 17 10"/>
      <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
    </symbol>
    <symbol id="icon-upload" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
      <polyline points="17 8 12 3 7 8"/>
      <line x1="12" y1="3" x2="12" y2="15"/>
    </symbol>
    <symbol id="icon-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
      <polyline points="7 10 12 15 17 10"/>
      <line x1="12" y1="15" x2="12" y2="3"/>
    </symbol>
    <symbol id="icon-bolt" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
    </symbol>
    <symbol id="icon-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
    </symbol>
  </svg>

  <header class="app-header">
    <div class="header-inner">
      <h1>AirShare</h1>
      <span id="readyPill" class="status-pill" role="status">
        <span class="dot" aria-hidden="true"></span>
        <span id="readyText">準備中</span>
      </span>
    </div>
  </header>

  <main>
    <div id="connectPanel">
      <section class="card" aria-labelledby="myCodeHeading">
        <div class="card-head">
          <h2 id="myCodeHeading">自分のコード</h2>
        </div>
        <div class="code-row">
          <span id="myId" class="code-box">-----</span>
          <div class="code-actions">
            <span class="copy-wrap">
              <button type="button" id="copyCodeBtn" class="pill-btn" aria-label="接続コードをコピー">
                <svg class="svg-icon icon-copy" width="15" height="15" aria-hidden="true"><use href="#icon-copy"></use></svg>
                <svg class="svg-icon icon-check" width="15" height="15" aria-hidden="true"><use href="#icon-check"></use></svg>
                コピー
              </button>
              <span id="copyTip" class="copy-tip" role="status"></span>
            </span>
            <button type="button" id="shareLinkBtn" class="pill-btn hidden" aria-label="接続リンクを共有">
              <svg class="svg-icon" width="15" height="15" aria-hidden="true"><use href="#icon-share"></use></svg>
              共有
            </button>
          </div>
          <div id="qrcode" aria-label="接続用QRコード"></div>
        </div>
      </section>

      <section class="card" aria-labelledby="targetHeading">
        <div class="card-head">
          <h2 id="targetHeading">相手に接続</h2>
        </div>
        <div class="connect-row">
          <input type="tel" id="targetId" class="code-input" placeholder="00000" maxlength="5" pattern="[0-9]*" inputmode="numeric" autocomplete="one-time-code" aria-label="相手の5桁のコード">
          <button type="button" id="connectBtn" class="btn-primary">
            <svg id="connectBtnIcon" class="svg-icon" width="17" height="17" aria-hidden="true"><use href="#icon-arrow-right"></use></svg>
            <span id="connectBtnLabel">接続</span>
          </button>
          <button type="button" id="cancelConnectBtn" class="btn-icon hidden" aria-label="接続をキャンセル">
            <svg class="svg-icon" width="17" height="17" aria-hidden="true"><use href="#icon-close"></use></svg>
          </button>
        </div>
        <p id="connStatus" class="status-line hidden" role="status"></p>
      </section>
    </div>

    <div id="transferPanel" class="hidden">
      <section class="card" aria-labelledby="sendHeading">
        <div class="card-head">
          <div class="session-meta">
            <h2 id="sendHeading" class="sr-only" hidden>転送</h2>
            <span id="peerIdLabel" class="peer-id-label">-----</span>
            <span id="modeChip" class="mode-chip" role="status">
              <svg id="modeChipIcon" class="svg-icon" width="13" height="13" aria-hidden="true"><use href="#icon-shield"></use></svg>
              <span id="modeChipText">接続中</span>
            </span>
          </div>
          <div class="session-actions">
            <button type="button" id="reconnectBtn" class="btn-icon hidden" aria-label="再接続">
              <svg class="svg-icon" width="16" height="16" aria-hidden="true"><use href="#icon-refresh"></use></svg>
            </button>
            <button type="button" id="disconnectBtn" class="btn-icon btn-icon-danger" aria-label="接続を終了">
              <svg class="svg-icon" width="16" height="16" aria-hidden="true"><use href="#icon-close"></use></svg>
            </button>
          </div>
        </div>

        <div id="dropZone" role="button" tabindex="0">

<script>
const PEER_PREFIX = "lanp2p-share-";
const STORAGE_MY_ID = "airshare_my_id";
const STORAGE_PAIRED_PEER = "airshare_paired_peer";
const MQTT_BROKERS = [
  "wss://broker.emqx.io:8084/mqtt",
  "wss://broker.hivemq.com:8884/mqtt",
  "wss://test.mosquitto.org:8081"
];

const P2P_CHUNK_SIZE = 16 * 1024;
const P2P_ACK_INTERVAL = 16;
const RELAY_CHUNK_SIZE = 24 * 1024;
const RELAY_WINDOW = 6;
const RELAY_PACE_MS = 8;

const CONNECT_TIMEOUT_MS = 12000;
const MAX_RECONNECT_ATTEMPTS = 5;
const RECONNECT_DELAYS = [600, 2000, 4500, 8000, 12000];

let myId = "";
let peer = null;
let dataConn = null;
let mqttClient = null;
let mqttBrokerIndex = 0;
let mqttReady = false;
let peerReady = false;
let currentInboxTopic = "";

let connState = "idle"; // "idle" | "connecting" | "connected" | "reconnecting" | "disconnected"
let connectingTargetId = null;
let pairedPeerId = null;
let currentAttemptId = null;

let connectTimeoutTimer = null;
let retryHelloTimers = [];
let reconnectTimer = null;
let reconnectAttempt = 0;
let silentP2PRetryTimer = null;
let connectedWaiters = [];

let isDirectP2P = false;
let isRelayReady = false;
let relayInTopic = "";
let relayOutTopic = "";

let myKeyPair = null;
let myPubKeyB64 = "";
let sharedAesKey = null;

let incomingFileInfo = null;
let incomingChunks = [];
let receivedSize = 0;
let expectedSeq = 0;
let incomingAckInterval = RELAY_WINDOW;
let p2pRecvChain = Promise.resolve();

let sendQueue = Promise.resolve();
let pendingAckWaiter = null;

let copyTipTimer = null;
let lastCopyMessage = "";

const textEncoder = new TextEncoder();
const textDecoder = new TextDecoder();

window.addEventListener("DOMContentLoaded", async () => {
  const savedId = normalizeCode(sessionStorage.getItem(STORAGE_MY_ID));
  myId = savedId.length === 5 ? savedId : generateCode();
  sessionStorage.setItem(STORAGE_MY_ID, myId);
  renderMyCode(myId);
  setupUIEvents();

  await initCrypto();
  startMqttClient();
  initPeerJS();

  const urlParams = new URLSearchParams(window.location.search);
  const autoTargetId = normalizeCode(urlParams.get("connect"));
  if (autoTargetId.length === 5 && autoTargetId !== myId) {
    sessionStorage.removeItem(STORAGE_PAIRED_PEER);
    document.getElementById("targetId").value = autoTargetId;
    connectToPeer(autoTargetId);
    return;
  }

  const savedPeer = normalizeCode(sessionStorage.getItem(STORAGE_PAIRED_PEER));
  if (savedPeer.length === 5 && savedPeer !== myId) {
    pairedPeerId = savedPeer;
    document.getElementById("connectPanel").classList.add("hidden");
    document.getElementById("transferPanel").classList.remove("hidden");
    document.getElementById("peerIdLabel").textContent = savedPeer;
    startAutoReconnect(true);
  }
});

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  wakeTransports();
  if (pairedPeerId && !hasLiveTransport()) {
    startAutoReconnect(true);
  }
});

window.addEventListener("online", () => {
  wakeTransports();
  if (pairedPeerId && !hasLiveTransport()) {
    startAutoReconnect(true);
  }
});

function sleep(ms) {
  return new Promise((resolve) => setTimeout(resolve, ms));
}

function generateCode() {
  return Math.floor(10000 + Math.random() * 90000).toString();
}

function normalizeCode(str) {
  return (str || "")
    .replace(/[０-９]/g, (ch) => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0))
    .replace(/\D/g, "")
    .slice(0, 5);
}

function hasLiveTransport() {
  return Boolean((dataConn && dataConn.open) || (isRelayReady && mqttReady));
}

function wakeTransports() {
  if (!peer || peer.destroyed) {
    initPeerJS();
  } else if (peer.disconnected) {
    try { peer.reconnect(); } catch {}
  }

  if (!mqttClient) {
    startMqttClient();
  } else if (!mqttClient.connected && !mqttReady) {
    try { mqttClient.reconnect(); } catch {}
  }
}

function renderMyCode(id) {
  document.getElementById("myId").textContent = id;
  const qrContainer = document.getElementById("qrcode");
  qrContainer.innerHTML = "";
  const connectUrl = `${window.location.origin}${window.location.pathname}?connect=${id}`;
  if (typeof QRCode === "function") {
    new QRCode(qrContainer, {
      text: connectUrl,
      width: 140,
      height: 140,
      colorDark: "#000000",
      colorLight: "#ffffff"
    });
  }
}

function updateReadyIndicator() {
  const pill = document.getElementById("readyPill");
  const text = document.getElementById("readyText");
  if (connState === "connected") {
    pill.classList.add("is-ready");
    text.textContent = isDirectP2P ? "P2P" : "接続中";
    return;
  }
  if (connState === "reconnecting") {
    pill.classList.remove("is-ready");
    text.textContent = "再接続中";
    return;
  }
  if (mqttReady || peerReady) {
    pill.classList.add("is-ready");
    text.textContent = "待機中";
  } else {
    pill.classList.remove("is-ready");
    text.textContent = "準備中";
  }
}

function setConnStatus(message = "", isError = false) {
  const el = document.getElementById("connStatus");
  if (!message) {
    el.textContent = "";
    el.classList.add("hidden");
    el.classList.remove("is-error");
    return;
  }
  el.textContent = message;
  el.classList.remove("hidden");
  el.classList.toggle("is-error", isError);
}

function setConnectingUI(isConnecting) {
  const btn = document.getElementById("connectBtn");
  const label = document.getElementById("connectBtnLabel");
  const iconUse = document.querySelector("#connectBtnIcon use");
  const iconSvg = document.getElementById("connectBtnIcon");
  const cancelBtn = document.getElementById("cancelConnectBtn");
  btn.disabled = isConnecting;
  label.textContent = isConnecting ? "接続中" : "接続";
  iconUse.setAttribute("href", isConnecting ? "#icon-refresh" : "#icon-arrow-right");
  iconSvg.classList.toggle("is-spinning", isConnecting);
  cancelBtn.classList.toggle("hidden", !isConnecting);
}

// === Web Crypto (ECDH P-256 + AES-256-GCM) ===
function bytesToBase64(bytes) {
  let bin = "";
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}

function base64ToBytes(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

async function initCrypto() {
  if (!window.crypto || !crypto.subtle) return;
  myKeyPair = await crypto.subtle.generateKey(
    { name: "ECDH", namedCurve: "P-256" },
    true,
    ["deriveKey"]
  );
  const rawPub = await crypto.subtle.exportKey("raw", myKeyPair.publicKey);
  myPubKeyB64 = bytesToBase64(new Uint8Array(rawPub));
}

async function deriveAesKey(remotePubB64) {
  if (!crypto.subtle || !myKeyPair || !remotePubB64) return null;
  const remotePub = await crypto.subtle.importKey(
    "raw",
    base64ToBytes(remotePubB64),
    { name: "ECDH", namedCurve: "P-256" },
    false,
    []
  );
  return crypto.subtle.deriveKey(
    { name: "ECDH", public: remotePub },
    myKeyPair.privateKey,
    { name: "AES-GCM", length: 256 },
    false,
    ["encrypt", "decrypt"]
  );
}

async function encryptPacket(plainUint8) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const encrypted = new Uint8Array(
    await crypto.subtle.encrypt({ name: "AES-GCM", iv }, sharedAesKey, plainUint8)
  );
  const packet = new Uint8Array(12 + encrypted.length);
  packet.set(iv, 0);
  packet.set(encrypted, 12);
  return packet;
}

async function decryptPacket(rawPayload) {
  const bytes = new Uint8Array(rawPayload.buffer, rawPayload.byteOffset, rawPayload.byteLength);
  const iv = bytes.slice(0, 12);
  const ciphertext = bytes.slice(12);
  const plainBuf = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, sharedAesKey, ciphertext);
  return new Uint8Array(plainBuf);
}

// === MQTT WSS Signaling & Encrypted Fallback Transport ===
function mqttSubscribe(topic, opts = { qos: 1 }) {
  return new Promise((resolve, reject) => {
    if (!mqttClient) return reject(new Error("MQTT unavailable"));
    mqttClient.subscribe(topic, opts, (err) => (err ? reject(err) : resolve()));
  });
}

function mqttPublish(topic, payload, opts = { qos: 1 }) {
  return new Promise((resolve, reject) => {
    if (!mqttClient) return reject(new Error("MQTT unavailable"));
    mqttClient.publish(topic, payload, opts, (err) => (err ? reject(err) : resolve()));
  });
}

function startMqttClient() {
  if (typeof mqtt === "undefined") return;
  const brokerUrl = MQTT_BROKERS[mqttBrokerIndex % MQTT_BROKERS.length];
  let settled = false;

  const client = mqtt.connect(brokerUrl, {
    clientId: `airshare_${myId}_${Math.random().toString(16).slice(2, 8)}`,
    clean: true,
    connectTimeout: 4500,
    reconnectPeriod: 2000,
    keepalive: 25
  });
  mqttClient = client;

  const failoverTimer = setTimeout(() => {
    if (!settled) {
      settled = true;
      try { client.end(true); } catch {}
      mqttBrokerIndex += 1;
      startMqttClient();
    }
  }, 5000);

  client.on("connect", async () => {
    if (mqttClient !== client) return;
    settled = true;
    clearTimeout(failoverTimer);
    mqttReady = true;
    updateReadyIndicator();

    const inbox = `lanp2p-v2/inbox/${myId}`;
    currentInboxTopic = inbox;
    try {
      await mqttSubscribe(inbox, { qos: 1 });
      if (relayInTopic) {
        await mqttSubscribe(relayInTopic, { qos: 1 });
      }
      if (connectingTargetId && !isRelayReady) {
        sendMqttOffer("hello", connectingTargetId, currentAttemptId);
      } else if (pairedPeerId && !isRelayReady && currentAttemptId) {
        sendMqttOffer("reconnect", pairedPeerId, currentAttemptId);
      }
    } catch {}
  });

  client.on("message", (topic, payload) => {
    if (topic === currentInboxTopic) {
      const bytes = new Uint8Array(payload.buffer, payload.byteOffset, payload.byteLength);
      try {
        const msg = JSON.parse(textDecoder.decode(bytes));
        handleInboxMessage(msg);
      } catch {}
      return;
    }
    if (relayInTopic && topic === relayInTopic) {
      handleEncryptedRelayPacket(payload);
    }
  });

  const onDrop = () => {
    if (mqttClient !== client) return;
    mqttReady = false;
    isRelayReady = false;
    updateReadyIndicator();
    if (pairedPeerId) {
      if (dataConn && dataConn.open) {
        updateTransferStatus();
      } else if (connState === "connected") {
        startAutoReconnect(false);
      }
    }
  };

  client.on("offline", onDrop);
  client.on("close", onDrop);

  client.on("error", () => {
    if (!settled) {
      settled = true;
      clearTimeout(failoverTimer);
      try { client.end(true); } catch {}
      mqttBrokerIndex += 1;
      startMqttClient();
    }
  });
}

async function sendMqttOffer(kind, targetId, attemptId) {
  if (!mqttClient || !mqttReady || !myPubKeyB64 || !targetId || !attemptId) return;
  try {
    await mqttPublish(
      `lanp2p-v2/inbox/${targetId}`,
      JSON.stringify({ kind, from: myId, pubKey: myPubKeyB64, attemptId }),
      { qos: 1 }
    );
  } catch {}
}

async function handleInboxMessage(msg) {
  if (!msg || !msg.kind || !msg.from) return;

  if (msg.kind === "hello" || msg.kind === "reconnect") {
    const activeTarget = connectingTargetId || pairedPeerId;
    if (pairedPeerId && pairedPeerId !== msg.from) {
      await mqttPublish(`lanp2p-v2/inbox/${msg.from}`, JSON.stringify({ kind: "busy", from: myId }), { qos: 1 }).catch(() => {});
      return;
    }
    if ((connState === "connecting" || connState === "reconnecting") && activeTarget === msg.from && currentAttemptId) {
      if (myId > msg.from) {
        return; // impolite peer keeps own attemptId
      }
    }
    try {
      sharedAesKey = await deriveAesKey(msg.pubKey);
      const nextIn = `lanp2p-v2/stream/${msg.attemptId}/from-${msg.from}`;
      const nextOut = `lanp2p-v2/stream/${msg.attemptId}/from-${myId}`;
      if (relayInTopic && relayInTopic !== nextIn && mqttClient) {
        try { mqttClient.unsubscribe(relayInTopic); } catch {}
      }
      relayInTopic = nextIn;
      relayOutTopic = nextOut;
      currentAttemptId = msg.attemptId;
      await mqttSubscribe(relayInTopic, { qos: 1 });
      await mqttPublish(
        `lanp2p-v2/inbox/${msg.from}`,
        JSON.stringify({ kind: "hello-ack", from: myId, pubKey: myPubKeyB64, attemptId: msg.attemptId }),
        { qos: 1 }
      );
      isRelayReady = true;
      enterConnectedState(msg.from, "relay");
    } catch {}
  } else if (msg.kind === "hello-ack") {
    const expectedPeer = connectingTargetId || pairedPeerId;
    if (msg.attemptId !== currentAttemptId || msg.from !== expectedPeer) return;
    try {
      sharedAesKey = await deriveAesKey(msg.pubKey);
      const nextIn = `lanp2p-v2/stream/${msg.attemptId}/from-${msg.from}`;
      const nextOut = `lanp2p-v2/stream/${msg.attemptId}/from-${myId}`;
      if (relayInTopic && relayInTopic !== nextIn && mqttClient) {
        try { mqttClient.unsubscribe(relayInTopic); } catch {}
      }
      relayInTopic = nextIn;
      relayOutTopic = nextOut;
      await mqttSubscribe(relayInTopic, { qos: 1 });
      isRelayReady = true;
      enterConnectedState(msg.from, "relay");
    } catch {}
  } else if (msg.kind === "busy") {
    if (msg.from === connectingTargetId) {
      cancelPendingConnection("相手は別の端末と接続中です", true);
    }
  } else if (msg.kind === "bye") {
    if (msg.from === pairedPeerId || msg.from === connectingTargetId) {
      resetToConnectPanel("相手が接続を終了しました");
    }
  }
}

// === WebRTC PeerJS (Fast Direct P2P with Raw Framing) ===
function initPeerJS() {
  if (typeof Peer === "undefined") return;
  peer = new Peer(PEER_PREFIX + myId, {
    debug: 1,
    config: {
      iceServers: [
        { urls: "stun:stun.l.google.com:19302" },
        { urls: "stun:stun.cloudflare.com:3478" }
      ]
    }
  });

  peer.on("open", () => {
    peerReady = true;
    updateReadyIndicator();
    const target = connectingTargetId || pairedPeerId;
    if (target && (!dataConn || !dataConn.open)) {
      firePeerConnect(target);
    }
  });

  peer.on("connection", (conn) => {
    attachWebRtcConn(conn);
  });

  peer.on("error", (err) => {
    if (err.type === "unavailable-id") {
      try { peer.destroy(); } catch {}
      peerReady = false;
      myId = generateCode();
      sessionStorage.setItem(STORAGE_MY_ID, myId);
      renderMyCode(myId);
      if (mqttClient && mqttReady) {
        const oldInbox = currentInboxTopic;
        currentInboxTopic = `lanp2p-v2/inbox/${myId}`;
        if (oldInbox) mqttClient.unsubscribe(oldInbox);
        mqttSubscribe(currentInboxTopic, { qos: 1 }).catch(() => {});
      }
      initPeerJS();
      return;
    }
    if (err.type === "peer-unavailable") {
      if (!mqttReady && !isRelayReady && connState === "connecting") {
        cancelPendingConnection("相手が見つかりませんでした", true);
      }
    }
  });
}

function firePeerConnect(targetId) {
  if (!peer || !peerReady || !targetId) return;
  try {
    const conn = peer.connect(PEER_PREFIX + targetId, { reliable: true, serialization: "raw" });
    attachWebRtcConn(conn);
  } catch {}
}

function attachWebRtcConn(conn) {
  const remoteId = conn.peer.replace(PEER_PREFIX, "");
  if (pairedPeerId && pairedPeerId !== remoteId) {
    conn.close();
    return;
  }
  if (dataConn && dataConn.open && dataConn !== conn) {
    conn.close();
    return;
  }
  dataConn = conn;
  if (conn.dataChannel) {
    conn.dataChannel.binaryType = "arraybuffer";
  }

  const onOpen = () => {
    if (conn.dataChannel) {
      conn.dataChannel.binaryType = "arraybuffer";
    }
    isDirectP2P = true;
    clearSilentP2PRetry();
    enterConnectedState(remoteId, "p2p");
  };

  if (conn.open) {
    onOpen();
  } else {
    conn.on("open", onOpen);
  }

  conn.on("data", (raw) => {
    p2pRecvChain = p2pRecvChain
      .then(async () => {
        let bytes;
        if (raw instanceof ArrayBuffer) bytes = new Uint8Array(raw);
        else if (ArrayBuffer.isView(raw)) bytes = new Uint8Array(raw.buffer, raw.byteOffset, raw.byteLength);
        else if (raw instanceof Blob) bytes = new Uint8Array(await raw.arrayBuffer());
        else return;
        handleFramePacket(bytes, "p2p");
      })
      .catch((err) => console.error("P2P recv error:", err));
  });

  if (conn.peerConnection) {
    conn.peerConnection.addEventListener("iceconnectionstatechange", () => {
      const state = conn.peerConnection.iceConnectionState;
      if ((state === "disconnected" || state === "failed") && dataConn === conn) {
        handleWebRtcDrop(conn);
      }
    });
  }

  conn.on("close", () => handleWebRtcDrop(conn));
  conn.on("error", () => handleWebRtcDrop(conn));
}

function handleWebRtcDrop(conn) {
  if (dataConn !== conn) return;
  dataConn = null;
  isDirectP2P = false;
  if (!pairedPeerId) return;

  if (isRelayReady && mqttReady) {
    updateTransferStatus();
    scheduleSilentP2PRetry();
  } else {
    startAutoReconnect(false);
  }
}

function clearSilentP2PRetry() {
  if (silentP2PRetryTimer) {
    clearTimeout(silentP2PRetryTimer);
    silentP2PRetryTimer = null;
  }
}

function scheduleSilentP2PRetry() {
  clearSilentP2PRetry();
  silentP2PRetryTimer = setTimeout(() => {
    if (pairedPeerId && (!dataConn || !dataConn.open) && peerReady) {
      firePeerConnect(pairedPeerId);
    }
  }, 4000);
}

// === Connection & Auto-Reconnect Lifecycle ===
function clearConnectionTimers() {
  if (connectTimeoutTimer) {
    clearTimeout(connectTimeoutTimer);
    connectTimeoutTimer = null;
  }
  retryHelloTimers.forEach((id) => clearTimeout(id));
  retryHelloTimers = [];
  if (reconnectTimer) {
    clearTimeout(reconnectTimer);
    reconnectTimer = null;
  }
}

function connectToPeer(rawTargetId) {
  const targetId = normalizeCode(rawTargetId);
  if (targetId.length !== 5) {
    setConnStatus("5桁の数字を入力してください", true);
    return;
  }
  if (targetId === myId) {
    setConnStatus("自分のコードには接続できません", true);
    return;
  }

  clearConnectionTimers();
  connState = "connecting";
  connectingTargetId = targetId;
  currentAttemptId = crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(16).slice(2)}`;

  setConnectingUI(true);
  setConnStatus(`${targetId} に接続しています`);
  updateReadyIndicator();

  if (mqttReady) sendMqttOffer("hello", targetId, currentAttemptId);
  if (peerReady) firePeerConnect(targetId);

  retryHelloTimers.push(
    setTimeout(() => {
      if (connState === "connecting" && connectingTargetId === targetId && !isRelayReady) {
        sendMqttOffer("hello", targetId, currentAttemptId);
      }
    }, 2500),
    setTimeout(() => {
      if (connState === "connecting" && connectingTargetId === targetId && !isRelayReady) {
        sendMqttOffer("hello", targetId, currentAttemptId);
      }
    }, 6000)
  );

  connectTimeoutTimer = setTimeout(() => {
    if (connState === "connecting" && connectingTargetId === targetId && !pairedPeerId) {
      cancelPendingConnection("相手が見つかりませんでした", true);
    }
  }, CONNECT_TIMEOUT_MS);
}

function cancelPendingConnection(statusText = "", isError = false) {
  clearConnectionTimers();
  connState = "idle";
  connectingTargetId = null;
  currentAttemptId = null;
  if (dataConn && !dataConn.open) {
    try { dataConn.close(); } catch {}
    dataConn = null;
  }
  setConnectingUI(false);
  setConnStatus(statusText, isError);
  updateReadyIndicator();
}

function startAutoReconnect(resetBackoff = false) {
  if (!pairedPeerId) return;
  if (hasLiveTransport()) {
    enterConnectedState(pairedPeerId, isDirectP2P ? "p2p" : "relay");
    return;
  }
  if (connState === "reconnecting" && !resetBackoff) return;

  clearConnectionTimers();
  if (resetBackoff) reconnectAttempt = 0;

  const scheduleNext = () => {
    if (!pairedPeerId || hasLiveTransport()) return;
    if (reconnectAttempt >= MAX_RECONNECT_ATTEMPTS) {
      connState = "disconnected";
      updateTransferStatus();
      updateReadyIndicator();
      return;
    }

    const delay = RECONNECT_DELAYS[Math.min(reconnectAttempt, RECONNECT_DELAYS.length - 1)];
    reconnectAttempt += 1;
    connState = "reconnecting";
    updateTransferStatus();
    updateReadyIndicator();

    reconnectTimer = setTimeout(() => {
      if (!pairedPeerId || hasLiveTransport()) return;
      wakeTransports();
      currentAttemptId = crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(16).slice(2)}`;
      if (mqttReady) sendMqttOffer("reconnect", pairedPeerId, currentAttemptId);
      if (peerReady) firePeerConnect(pairedPeerId);

      reconnectTimer = setTimeout(scheduleNext, 3500);
    }, delay);
  };

  scheduleNext();
}

function ensureConnected(timeoutMs = 10000) {
  if (hasLiveTransport()) return Promise.resolve();
  if (!pairedPeerId) return Promise.reject(new Error("未接続"));
  wakeTransports();
  startAutoReconnect(true);

  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => {
      connectedWaiters = connectedWaiters.filter((w) => w !== waiter);
      reject(new Error("再接続がタイムアウトしました"));
    }, timeoutMs);

    const waiter = {
      resolve: () => { clearTimeout(timer); resolve(); },
      reject: (err) => { clearTimeout(timer); reject(err); }
    };
    connectedWaiters.push(waiter);
  });
}

function enterConnectedState(remoteId, mode) {
  clearConnectionTimers();
  connectingTargetId = null;
  pairedPeerId = remoteId;
  sessionStorage.setItem(STORAGE_PAIRED_PEER, remoteId);
  connState = "connected";
  reconnectAttempt = 0;

  if (mode === "p2p") isDirectP2P = true;
  if (mode === "relay") isRelayReady = true;

  setConnectingUI(false);
  document.getElementById("connectPanel").classList.add("hidden");
  document.getElementById("transferPanel").classList.remove("hidden");
  document.getElementById("peerIdLabel").textContent = remoteId;

  updateTransferStatus();
  updateReadyIndicator();

  while (connectedWaiters.length > 0) {
    connectedWaiters.shift().resolve();
  }

  if (window.location.search) {
    window.history.replaceState({}, document.title, window.location.pathname);
  }
}

function updateTransferStatus() {
  const chip = document.getElementById("modeChip");
  const chipIconUse = document.querySelector("#modeChipIcon use");
  const chipIconSvg = document.getElementById("modeChipIcon");
  const chipText = document.getElementById("modeChipText");
  const reconnectBtn = document.getElementById("reconnectBtn");
  const dropZone = document.getElementById("dropZone");

  chip.className = "mode-chip";
  chipIconSvg.classList.remove("is-spinning");

  if (connState === "connected" && isDirectP2P) {
    chip.classList.add("is-p2p");
    chipIconUse.setAttribute("href", "#icon-bolt");
    chipText.textContent = "P2P";
    reconnectBtn.classList.add("hidden");
    dropZone.classList.remove("is-disabled");
  } else if (connState === "connected" && isRelayReady) {
    chip.classList.add("is-relay");
    chipIconUse.setAttribute("href", "#icon-shield");
    chipText.textContent = "暗号化";
    reconnectBtn.classList.add("hidden");
    dropZone.classList.remove("is-disabled");
  } else if (connState === "reconnecting") {
    chip.classList.add("is-reconnecting");
    chipIconUse.setAttribute("href", "#icon-refresh");
    chipIconSvg.classList.add("is-spinning");
    chipText.textContent = `再接続中 ${reconnectAttempt}/${MAX_RECONNECT_ATTEMPTS}`;
    reconnectBtn.classList.remove("hidden");
    dropZone.classList.add("is-disabled");
  } else {
    chip.classList.add("is-disconnected");
    chipIconUse.setAttribute("href", "#icon-close");
    chipText.textContent = "切断";
    reconnectBtn.classList.remove("hidden");
    dropZone.classList.add("is-disabled");
  }
}

function resetToConnectPanel(statusMsg = "") {
  clearConnectionTimers();
  clearSilentP2PRetry();
  connState = "idle";
  connectingTargetId = null;
  pairedPeerId = null;
  currentAttemptId = null;
  reconnectAttempt = 0;
  isDirectP2P = false;
  isRelayReady = false;
  sharedAesKey = null;

  sessionStorage.removeItem(STORAGE_PAIRED_PEER);

  if (relayInTopic && mqttClient) {
    try { mqttClient.unsubscribe(relayInTopic); } catch {}
  }
  relayInTopic = "";
  relayOutTopic = "";

  if (dataConn) {
    try { dataConn.close(); } catch {}
    dataConn = null;
  }

  if (pendingAckWaiter) {
    pendingAckWaiter.reject(new Error("Disconnected"));
    pendingAckWaiter = null;
  }
  while (connectedWaiters.length > 0) {
    connectedWaiters.shift().reject(new Error("Disconnected"));
  }

  incomingFileInfo = null;
  incomingChunks = [];
  receivedSize = 0;
  expectedSeq = 0;

  document.getElementById("sendProgressBox").style.display = "none";
  document.getElementById("recvProgressBox").style.display = "none";
  document.getElementById("transferPanel").classList.add("hidden");
  document.getElementById("connectPanel").classList.remove("hidden");
  setConnectingUI(false);
  setConnStatus(statusMsg, false);
  updateReadyIndicator();
}

// === Framed File Sending (Raw P2P + Windowed Paced E2EE Relay) ===
function buildControlFrame(obj) {
  const jsonBytes = textEncoder.encode(JSON.stringify(obj));
  const frame = new Uint8Array(1 + jsonBytes.length);
  frame[0] = 0x01;
  frame.set(jsonBytes, 1);
  return frame;
}

function buildChunkFrame(seq, chunkBytes) {
  const frame = new Uint8Array(1 + 4 + chunkBytes.length);
  frame[0] = 0x02;
  new DataView(frame.buffer).setUint32(1, seq, false);
  frame.set(chunkBytes, 5);
  return frame;
}

function sendFiles(files, onAfterDone) {
  if (!pairedPeerId) return;
  const fileArray = Array.from(files);
  sendQueue = sendQueue
    .then(() => processSendQueue(fileArray))
    .catch((err) => {
      console.error(err);
      document.getElementById("sendProgressBox").style.display = "none";
    })
    .finally(() => {
      if (typeof onAfterDone === "function") onAfterDone();
    });
}

async function processSendQueue(files) {
  const progressBox = document.getElementById("sendProgressBox");
  const progressBar = document.getElementById("sendProgress");
  const fileNameEl = document.getElementById("sendFileName");
  const percentEl = document.getElementById("sendPercent");

  progressBox.style.display = "block";

  for (let idx = 0; idx < files.length; idx++) {
    const file = files[idx];
    await ensureConnected(10000);

    fileNameEl.textContent = file.name;
    progressBar.value = 0;
    percentEl.textContent = "0%";

    if (dataConn && dataConn.open) {
      await sendFileViaP2P(file, progressBar, percentEl);
    } else {
      await sendFileViaRelay(file, progressBar, percentEl);
    }

    addFileToList(file.name, file.size, file.type, file, "送信");
    if (idx < files.length - 1) {
      await sleep(50);
    }
  }

  setTimeout(() => { progressBox.style.display = "none"; }, 1400);
}

function waitForChunkAck(transferId, seq, timeoutMs = 5000) {
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => {
      if (pendingAckWaiter && pendingAckWaiter.transferId === transferId) {
        pendingAckWaiter = null;
      }
      reject(new Error("ACK timeout"));
    }, timeoutMs);

    pendingAckWaiter = {
      transferId,
      seq,
      resolve: () => { clearTimeout(timer); pendingAckWaiter = null; resolve(); },
      reject: (err) => { clearTimeout(timer); pendingAckWaiter = null; reject(err); }
    };
  });
}

async function sendFileViaP2P(file, progressBar, percentEl) {
  const transferId = `${Date.now()}_${Math.random().toString(16).slice(2, 8)}`;
  dataConn.send(buildControlFrame({
    type: "file-start",
    transferId,
    name: file.name,
    size: file.size,
    mime: file.type || "application/octet-stream"
  }));

  let offset = 0;
  let seq = 0;
  const dc = dataConn.dataChannel;

  while (offset < file.size) {
    if (!dataConn || !dataConn.open) {
      throw new Error("P2P closed");
    }
    while ((dc && dc.bufferedAmount > 256 * 1024) || dataConn.bufferSize > 0) {
      if (!dataConn || !dataConn.open) throw new Error("P2P closed");
      await sleep(15);
    }

    const slice = file.slice(offset, offset + P2P_CHUNK_SIZE);
    const chunkBytes = new Uint8Array(await slice.arrayBuffer());
    dataConn.send(buildChunkFrame(seq, chunkBytes));

    offset += chunkBytes.length;
    const percent = file.size > 0 ? Math.min(100, Math.round((offset / file.size) * 100)) : 100;
    progressBar.value = percent;
    percentEl.textContent = `${percent}%`;

    if ((seq + 1) % P2P_ACK_INTERVAL === 0 || offset >= file.size) {
      await waitForChunkAck(transferId, seq, 10000);
    }
    seq += 1;
  }

  dataConn.send(buildControlFrame({ type: "file-end", transferId }));
  progressBar.value = 100;
  percentEl.textContent = "100%";
}

async function sendRelayControl(obj) {
  const frame = buildControlFrame(obj);
  const packet = await encryptPacket(frame);
  await mqttPublish(relayOutTopic, packet, { qos: 1 });
}

async function sendFileViaRelay(file, progressBar, percentEl) {
  const transferId = `${Date.now()}_${Math.random().toString(16).slice(2, 8)}`;
  await ensureConnected(10000);
  await sendRelayControl({
    type: "file-start",
    transferId,
    name: file.name,
    size: file.size,
    mime: file.type || "application/octet-stream"
  });

  let winStartOffset = 0;
  let winStartSeq = 0;

  while (winStartOffset < file.size) {
    let winEndOffset = winStartOffset;
    let winEndSeq = winStartSeq;

    for (let attempt = 0; attempt < 4; attempt++) {
      try {
        await ensureConnected(10000);
        let offset = winStartOffset;
        let seq = winStartSeq;

        for (let i = 0; i < RELAY_WINDOW && offset < file.size; i++) {
          const slice = file.slice(offset, offset + RELAY_CHUNK_SIZE);
          const chunkBytes = new Uint8Array(await slice.arrayBuffer());
          const packet = await encryptPacket(buildChunkFrame(seq, chunkBytes));

          await mqttPublish(relayOutTopic, packet, { qos: 0 });
          offset += chunkBytes.length;
          winEndOffset = offset;
          winEndSeq = seq;

          const percent = file.size > 0 ? Math.min(100, Math.round((offset / file.size) * 100)) : 100;
          progressBar.value = percent;
          percentEl.textContent = `${percent}%`;

          seq += 1;
          await sleep(RELAY_PACE_MS);
        }

        await waitForChunkAck(transferId, winEndSeq, 5000);
        winStartOffset = winEndOffset;
        winStartSeq = winEndSeq + 1;
        break;
      } catch (err) {
        if (attempt === 3) throw err;
        await sleep(300);
      }
    }
  }

  await ensureConnected(10000);
  await sendRelayControl({ type: "file-end", transferId });
  progressBar.value = 100;
  percentEl.textContent = "100%";
}

// === Framed File Receiving ===
async function handleEncryptedRelayPacket(rawPayload) {
  if (!sharedAesKey) return;
  try {
    const plainBytes = await decryptPacket(rawPayload);
    handleFramePacket(plainBytes, "relay");
  } catch (err) {
    console.error("Relay decrypt error:", err);
  }
}

function sendAck(transferId, seq, transport) {
  const ackObj = { type: "chunk-ack", transferId, seq };
  if (transport === "p2p" && dataConn && dataConn.open) {
    try { dataConn.send(buildControlFrame(ackObj)); } catch {}
  } else if (isRelayReady && mqttReady) {
    sendRelayControl(ackObj).catch(() => {});
  }
}

function handleFramePacket(bytes, transport) {
  if (!bytes || bytes.length === 0) return;
  const frameType = bytes[0];

  if (frameType === 0x01) {
    const msg = JSON.parse(textDecoder.decode(bytes.subarray(1)));
    if (msg.type === "chunk-ack") {
      if (pendingAckWaiter && pendingAckWaiter.transferId === msg.transferId && msg.seq >= pendingAckWaiter.seq) {
        pendingAckWaiter.resolve();
      }
      return;
    }

    const progressBox = document.getElementById("recvProgressBox");
    const progressBar = document.getElementById("recvProgress");
    const fileNameEl = document.getElementById("recvFileName");
    const percentEl = document.getElementById("recvPercent");

    if (msg.type === "file-start") {
      incomingFileInfo = msg;
      incomingChunks = [];
      receivedSize = 0;
      expectedSeq = 0;
      incomingAckInterval = transport === "p2p" ? P2P_ACK_INTERVAL : RELAY_WINDOW;

      progressBox.style.display = "block";
      fileNameEl.textContent = msg.name;
      progressBar.value = 0;
      percentEl.textContent = "0%";
    } else if (msg.type === "file-end") {
      if (!incomingFileInfo) return;
      const blob = new Blob(incomingChunks, { type: incomingFileInfo.mime || "application/octet-stream" });
      addFileToList(incomingFileInfo.name, incomingFileInfo.size, incomingFileInfo.mime, blob, "受信");

      incomingFileInfo = null;
      incomingChunks = [];
      receivedSize = 0;
      expectedSeq = 0;
      setTimeout(() => { progressBox.style.display = "none"; }, 1400);
    }
    return;
  }

  if (frameType === 0x02) {
    if (!incomingFileInfo || bytes.length < 5) return;
    const seq = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength).getUint32(1, false);
    const chunk = bytes.slice(5);

    if (seq === expectedSeq) {
      incomingChunks.push(chunk);
      receivedSize += chunk.byteLength;
      expectedSeq = seq + 1;

      const percent = incomingFileInfo.size > 0
        ? Math.min(100, Math.round((receivedSize / incomingFileInfo.size) * 100))
        : 100;
      document.getElementById("recvProgress").value = percent;
      document.getElementById("recvPercent").textContent = `${percent}%`;
    } else if (seq > expectedSeq) {
      return;
    }

    if (((seq + 1) % incomingAckInterval === 0) || receivedSize >= incomingFileInfo.size) {
      sendAck(incomingFileInfo.transferId, expectedSeq - 1, transport);
    }
  }
}

// === History & iOS Share / Save ===
function formatFileSize(bytes) {
  if (bytes < 1024) return `${bytes} B`;
  if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
  return `${(bytes / (1024 * 1024)).toFixed(2)} MB`;
}

function createSvgIcon(symbolId, size = 15) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("class", "svg-icon");
  svg.setAttribute("width", String(size));
  svg.setAttribute("height", String(size));
  svg.setAttribute("aria-hidden", "true");
  const use = document.createElementNS("http://www.w3.org/2000/svg", "use");
  use.setAttribute("href", `#${symbolId}`);
  svg.append(use);
  return svg;
}

function addFileToList(name, size, mime, blob, statusLabel) {
  document.getElementById("historyCard").classList.remove("hidden");
  const list = document.getElementById("fileList");

  const li = document.createElement("li");
  li.className = "file-item";

  const url = URL.createObjectURL(blob);
  const isImage = mime && mime.startsWith("image/");

  const header = document.createElement("div");
  header.className = "file-header";

  const info = document.createElement("div");
  info.className = "file-info";
  const nameDiv = document.createElement("div");
  nameDiv.className = "file-name";
  nameDiv.textContent = name;
  const metaDiv = document.createElement("div");
  metaDiv.className = "file-meta";
  metaDiv.textContent = `${statusLabel} · ${formatFileSize(size)}`;
  info.append(nameDiv, metaDiv);

  const actions = document.createElement("div");
  actions.className = "file-actions";

  let shareFile = null;
  try {
    shareFile = new File([blob], name, { type: mime || "application/octet-stream" });
  } catch {}

  if (shareFile && navigator.canShare && navigator.canShare({ files: [shareFile] })) {
    const shareBtn = document.createElement("button");
    shareBtn.type = "button";
    shareBtn.className = "share-file-btn";
    shareBtn.setAttribute("aria-label", `${name} を共有`);
    shareBtn.append(createSvgIcon("icon-share", 14), document.createTextNode("共有"));
    shareBtn.addEventListener("click", async () => {
      try {
        await navigator.share({ files: [shareFile], title: name });
      } catch {}
    });
    actions.append(shareBtn);
  }

  const dlLink = document.createElement("a");
  dlLink.href = url;
  dlLink.download = name;
  dlLink.className = "dl-btn";
  dlLink.setAttribute("aria-label", `${name} を保存`);
  dlLink.append(createSvgIcon("icon-download", 14), document.createTextNode("保存"));
  actions.append(dlLink);

  header.append(info, actions);
  li.append(header);

  if (isImage) {
    const img = document.createElement("img");
    img.src = url;
    img.className = "preview-img";
    img.alt = name;
    li.append(img);
  }

  list.prepend(li);
}

// === UI Events & Copy Helper ===
function legacyCopy(text) {
  const previousFocus = document.activeElement;
  const field = Object.assign(document.createElement("textarea"), { value: text });
  field.setAttribute("readonly", "");
  field.style.cssText = "position:fixed;inset-block-start:0;opacity:0";
  document.body.append(field);
  field.select();
  try {
    return document.execCommand("copy");
  } finally {
    field.remove();
    previousFocus?.focus({ preventScroll: true });
  }
}

function showCopyTip(message, ok) {
  const btn = document.getElementById("copyCodeBtn");
  const tip = document.getElementById("copyTip");
  clearTimeout(copyTipTimer);
  let text = message;
  if (text === lastCopyMessage) text += "\u00A0";
  lastCopyMessage = message;
  if (ok) btn.setAttribute("data-copied", "");
  else btn.removeAttribute("data-copied");
  tip.textContent = "";
  tip.classList.add("is-visible");
  requestAnimationFrame(() => { tip.textContent = text; });
  copyTipTimer = setTimeout(() => {
    btn.removeAttribute("data-copied");
    tip.classList.remove("is-visible");
    tip.textContent = "";
  }, 1800);
}

function setupUIEvents() {
  const targetInput = document.getElementById("targetId");
  const connectBtn = document.getElementById("connectBtn");
  const cancelBtn = document.getElementById("cancelConnectBtn");
  const reconnectBtn = document.getElementById("reconnectBtn");
  const disconnectBtn = document.getElementById("disconnectBtn");
  const copyCodeBtn = document.getElementById("copyCodeBtn");
  const shareLinkBtn = document.getElementById("shareLinkBtn");

  if (navigator.share) {
    shareLinkBtn.classList.remove("hidden");
    shareLinkBtn.addEventListener("click", async () => {
      const url = `${window.location.origin}${window.location.pathname}?connect=${myId}`;
      try {
        await navigator.share({ title: "AirShare", text: `コード: ${myId}`, url });
      } catch {}
    });
  }

  copyCodeBtn.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(myId);
      showCopyTip("コピーしました", true);
    } catch {
      const ok = legacyCopy(myId);
      showCopyTip(ok ? "コピーしました" : "コピー失敗", ok);
    }
  });

  targetInput.addEventListener("input", () => {
    const cleaned = normalizeCode(targetInput.value);
    if (targetInput.value !== cleaned) {
      targetInput.value = cleaned;
    }
  });

  connectBtn.addEventListener("click", () => {
    connectToPeer(targetInput.value);
  });

  cancelBtn.addEventListener("click", () => {
    cancelPendingConnection("キャンセルしました", false);
  });

  reconnectBtn.addEventListener("click", () => {
    wakeTransports();
    startAutoReconnect(true);
  });

  disconnectBtn.addEventListener("click", () => {
    if (pairedPeerId && mqttClient && mqttReady) {
      mqttPublish(`lanp2p-v2/inbox/${pairedPeerId}`, JSON.stringify({ kind: "bye", from: myId }), { qos: 1 }).catch(() => {});
    }
    resetToConnectPanel("切断しました");
  });

  targetInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      connectBtn.click();
    }
  });

  const dropZone = document.getElementById("dropZone");
  const fileInput = document.getElementById("fileInput");

  dropZone.addEventListener("click", () => fileInput.click());
  dropZone.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      fileInput.click();
    }
  });

  fileInput.addEventListener("change", (e) => {
    if (e.target.files.length > 0) {
      sendFiles(e.target.files, () => {
        fileInput.value = "";
      });
    }
  });

  dropZone.addEventListener("dragover", (e) => {
    e.preventDefault();
    dropZone.classList.add("dragover");
  });
  dropZone.addEventListener("dragleave", () => dropZone.classList.remove("dragover"));
  dropZone.addEventListener("drop", (e) => {
    e.preventDefault();
    dropZone.classList.remove("dragover");
    if (e.dataTransfer.files.length > 0) sendFiles(e.dataTransfer.files);
  });
}
