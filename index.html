<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LAN P2P ファイル共有 (Win ⇔ iPhone)</title>
  <!-- PeerJS & QRCode生成ライブラリ -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root { --bg: #121212; --card: #1e1e1e; --accent: #00eaef; --primary: #007bff; --success: #28a745; }
    body { background-color: var(--bg); color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 15px; text-align: center; }
    h1 { font-size: 20px; margin-bottom: 15px; color: #eee; }
    .card { background: var(--card); padding: 20px; border-radius: 12px; margin: 0 auto 15px auto; max-width: 500px; border: 1px solid #333; text-align: left; box-sizing: border-box; }
    .card h2 { margin-top: 0; font-size: 16px; border-bottom: 1px solid #333; padding-bottom: 8px; }

    /* 接続コード表示 */
    .code-box { background: #000; padding: 12px; font-family: monospace; font-size: 32px; border-radius: 8px; letter-spacing: 4px; text-align: center; display: block; margin: 10px 0; color: var(--accent); border: 1px solid #444; font-weight: bold; }
    #qrcode { display: flex; justify-content: center; margin: 15px 0; background: #fff; padding: 12px; border-radius: 8px; width: fit-content; margin-left: auto; margin-right: auto; }

    /* 入力・ボタン */
    .input-group { display: flex; gap: 10px; margin-top: 10px; }
    input[type="text"], input[type="tel"] { flex: 1; padding: 12px; background: #2a2a2a; color: white; border: 1px solid #555; border-radius: 8px; font-size: 18px; font-family: monospace; text-align: center; }
    button { background: var(--primary); color: white; border: none; padding: 12px 20px; cursor: pointer; border-radius: 8px; font-weight: bold; font-size: 15px; transition: opacity 0.2s; }
    button:active { opacity: 0.7; }
    button:disabled { background: #555; cursor: not-allowed; }
    .btn-success { background: var(--success); width: 100%; margin-top: 10px; padding: 15px; font-size: 16px; }

    /* ファイルドロップゾーン */
    #dropZone { border: 2px dashed #555; border-radius: 12px; padding: 30px 15px; text-align: center; cursor: pointer; transition: 0.2s; background: #181818; margin-top: 10px; }
    #dropZone.dragover { border-color: var(--accent); background: #223033; }
    #fileInput { display: none; }

    /* プログレスバー */
    .progress-container { display: none; margin-top: 15px; }
    progress {
      appearance: none;
      border: 0 solid;
      overflow: clip;
      width: 100%;
      height: 12px;
      border-radius: 6px;
      background-color: #333;
    }
    progress::-webkit-progress-bar { background-color: transparent; }
    progress::-webkit-progress-value { background-color: var(--accent); border-radius: 6px; }
    progress::-moz-progress-bar { background-color: var(--accent); border-radius: 6px; }
    .status-text { font-size: 13px; color: #aaa; margin-top: 5px; display: flex; justify-content: space-between; }

    /* ファイル履歴リスト */
    .file-list { list-style: none; padding: 0; margin: 0; }
    .file-item { background: #262626; padding: 12px; border-radius: 8px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; border: 1px solid #383838; }
    .file-header { display: flex; justify-content: space-between; align-items: center; word-break: break-all; }
    .file-name { font-weight: bold; font-size: 14px; }
    .file-meta { font-size: 12px; color: #aaa; }
    .dl-btn { background: var(--success); color: #fff; text-decoration: none; padding: 8px 14px; border-radius: 6px; font-size: 13px; font-weight: bold; text-align: center; display: inline-block; }
    .preview-img { max-width: 100%; max-height: 200px; border-radius: 6px; object-fit: contain; background: #000; margin-top: 5px; }

    .hidden { display: none !important; }
    .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
    .badge-online { background: #1e4620; color: #4caf50; border: 1px solid #4caf50; }
    .note { font-size: 12px; color: #888; margin-top: 8px; line-height: 1.4; }
  </style>
</head>
<body>

  <main>
    <h1>⚡ LAN P2P ファイル共有</h1>

    <!-- ① マッチング（接続）画面 -->
    <div id="connectPanel">
      <div class="card">
        <h2>自分の接続コード (待機中)</h2>
        <p class="note">相手側でこの5桁のコードを入力するか、iPhoneのカメラでQRコードを読み取ってください。</p>
        <span id="myId" class="code-box">-----</span>
        <div id="qrcode"></div>
      </div>

      <div class="card">
        <h2>相手のコードに接続する</h2>
        <div class="input-group">
          <input type="tel" id="targetId" placeholder="5桁の数字" maxlength="5" pattern="[0-9]*" inputmode="numeric" aria-label="相手の5桁の接続コード">
          <button type="button" id="connectBtn">接続</button>
        </div>
        <p id="connStatus" class="note">待機中...</p>
      </div>
    </div>

    <!-- ② ファイル転送画面（接続後に表示） -->
    <div id="transferPanel" class="hidden">
      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <h2 style="margin:0; border:none;">ファイル送信</h2>
          <span id="peerBadge" class="badge badge-online">🟢 接続済み</span>
        </div>

        <div id="dropZone" role="button" tabindex="0">
          <p style="margin:0; font-size: 15px; font-weight: bold;">📁 タップしてファイルを選択</p>
          <p class="note" style="margin:5px 0 0 0;">（PCの場合はここにドラッグ＆ドロップも可能）</p>
          <input type="file" id="fileInput" multiple>
        </div>

        <!-- 送信プログレス -->
        <div id="sendProgressBox" class="progress-container">
          <div class="status-text">
            <span id="sendFileName">送信中...</span>
            <span id="sendPercent">0%</span>
          </div>
          <progress id="sendProgress" value="0" max="100" aria-labelledby="sendFileName"></progress>
        </div>

        <!-- 受信プログレス -->
        <div id="recvProgressBox" class="progress-container">
          <div class="status-text">
            <span id="recvFileName">受信中...</span>
            <span id="recvPercent">0%</span>
          </div>
          <progress id="recvProgress" value="0" max="100" aria-labelledby="recvFileName"></progress>
        </div>
      </div>

      <div class="card">
        <h2>送受信履歴</h2>
        <p class="note" style="margin-top:0;">※iPhoneで画像を保存する場合は、プレビュー画像を長押しして「"写真"に保存」を選択すると便利です。</p>
        <ul id="fileList" class="file-list"></ul>
      </div>
    </div>
  </main>

<script>
let peer = null;
let dataConn = null;
const CHUNK_SIZE = 64 * 1024; // 64KBチャンク（WebRTC安定転送の最適値）

// 受信バッファ用変数
let incomingFileInfo = null;
let incomingChunks = [];
let receivedSize = 0;

window.addEventListener("DOMContentLoaded", () => {
  initPeerJS();
  setupUIEvents();
});

// === 1. 元コードのマッチングシステム（PeerJS） ===
function initPeerJS() {
  const myIdEl = document.getElementById("myId");
  const connectBtn = document.getElementById("connectBtn");
  const connStatus = document.getElementById("connStatus");
  const peerId = Math.floor(10000 + Math.random() * 90000).toString();

  // ★元コードのチューニングを継承: TURNサーバーを排除し、LAN内P2Pを強制
  peer = new Peer(peerId, {
    debug: 1,
    config: {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' }
      ]
    }
  });

  peer.on('open', (id) => {
    myIdEl.textContent = id;
    generateQRCode(id);

    // URLに ?connect=12345 があれば自動接続（QRコード読み取り時）
    const urlParams = new URLSearchParams(window.location.search);
    const autoTargetId = urlParams.get('connect');
    if (autoTargetId && autoTargetId.length === 5 && autoTargetId !== id) {
      document.getElementById("targetId").value = autoTargetId;
      connectToPeer(autoTargetId);
    }
  });

  // 相手から接続された時
  peer.on('connection', (conn) => {
    setupConnection(conn);
  });

  peer.on('error', (err) => {
    if (err.type === 'unavailable-id') {
      peer.destroy();
      initPeerJS();
      return;
    }
    if (err.type === 'peer-unavailable') {
      connStatus.textContent = "エラー: 指定されたコードの相手が見つかりません。";
      connectBtn.disabled = false;
      return;
    }
    connectBtn.disabled = false;
    alert("通信エラーが発生しました: " + err.type);
    connStatus.textContent = "エラー: " + err.type;
  });
}

function connectToPeer(targetId) {
  if (!peer || !peer.open) {
    document.getElementById("connStatus").textContent = "接続準備中です。少しお待ちください...";
    return;
  }
  document.getElementById("connectBtn").disabled = true;
  document.getElementById("connStatus").textContent = `${targetId} に接続中...`;
  const conn = peer.connect(targetId, { reliable: true });
  setupConnection(conn);
}

function setupConnection(conn) {
  if (dataConn && dataConn.open) {
    conn.close(); // 既に接続済みの場合は拒否
    return;
  }
  dataConn = conn;

  dataConn.on('open', () => {
    document.getElementById("connectPanel").classList.add("hidden");
    document.getElementById("transferPanel").classList.remove("hidden");
    document.getElementById("peerBadge").textContent = `🟢 接続先: ${dataConn.peer}`;
    // URLパラメータを綺麗にする
    window.history.replaceState({}, document.title, window.location.pathname);
  });

  dataConn.on('data', handleIncomingData);

  dataConn.on('close', () => {
    alert("相手との接続が切断されました。");
    location.reload();
  });
}

// === 2. ファイル送信処理（チャンク分割＆バックプレッシャー制御） ===
async function sendFiles(files) {
  if (!dataConn || !dataConn.open) return alert("接続されていません");

  const progressBox = document.getElementById("sendProgressBox");
  const progressBar = document.getElementById("sendProgress");
  const fileNameEl = document.getElementById("sendFileName");
  const percentEl = document.getElementById("sendPercent");

  progressBox.style.display = "block";

  for (const file of files) {
    fileNameEl.textContent = `送信中: ${file.name}`;
    progressBar.value = 0;
    percentEl.textContent = "0%";

    // ① メタデータを先に送信
    dataConn.send({
      type: 'file-start',
      name: file.name,
      size: file.size,
      mime: file.type || 'application/octet-stream'
    });

    // ② ファイルを64KBずつスライスして送信
    let offset = 0;
    const dc = dataConn.dataChannel;

    while (offset < file.size) {
      // ★重要: バッファが1MB以上溜まっていたら少し待つ（Safariのクラッシュ防止）
      if (dc && dc.bufferedAmount > 1 * 1024 * 1024) {
        await new Promise(r => setTimeout(r, 50));
        continue;
      }

      const slice = file.slice(offset, offset + CHUNK_SIZE);
      const buffer = await slice.arrayBuffer();

      dataConn.send({
        type: 'file-chunk',
        data: buffer
      });

      offset += buffer.byteLength;
      const percent = Math.min(100, Math.round((offset / file.size) * 100));
      progressBar.value = percent;
      percentEl.textContent = `${percent}%`;
    }

    // ③ 完了通知を送信
    dataConn.send({ type: 'file-end' });
    addFileToList(file.name, file.size, file.type, file, "送信完了");
  }

  setTimeout(() => { progressBox.style.display = "none"; }, 2000);
}

// === 3. ファイル受信処理 ===
function handleIncomingData(payload) {
  const progressBox = document.getElementById("recvProgressBox");
  const progressBar = document.getElementById("recvProgress");
  const fileNameEl = document.getElementById("recvFileName");
  const percentEl = document.getElementById("recvPercent");

  // ① ファイル受信開始
  if (payload.type === 'file-start') {
    incomingFileInfo = payload;
    incomingChunks = [];
    receivedSize = 0;

    progressBox.style.display = "block";
    fileNameEl.textContent = `受信中: ${payload.name}`;
    progressBar.value = 0;
    percentEl.textContent = "0%";
  }
  // ② チャンクデータの結合
  else if (payload.type === 'file-chunk') {
    if (!incomingFileInfo) return;
    incomingChunks.push(payload.data);
    const chunkBytes = payload.data.byteLength ?? payload.data.size ?? 0;
    receivedSize += chunkBytes;

    const percent = Math.min(100, Math.round((receivedSize / incomingFileInfo.size) * 100));
    progressBar.value = percent;
    percentEl.textContent = `${percent}%`;
  }
  // ③ ファイル受信完了・Blob生成
  else if (payload.type === 'file-end') {
    if (!incomingFileInfo) return;
    const blob = new Blob(incomingChunks, { type: incomingFileInfo.mime });
    addFileToList(incomingFileInfo.name, incomingFileInfo.size, incomingFileInfo.mime, blob, "受信");

    // メモリ解放
    incomingFileInfo = null;
    incomingChunks = [];
    setTimeout(() => { progressBox.style.display = "none"; }, 2000);
  }
}

// === 4. UI・履歴表示・QRコード生成 ===
function addFileToList(name, size, mime, blob, statusLabel) {
  const list = document.getElementById("fileList");
  const li = document.createElement("li");
  li.className = "file-item";

  const url = URL.createObjectURL(blob);
  const sizeMB = (size / (1024 * 1024)).toFixed(2);
  const isImage = mime && mime.startsWith("image/");

  li.innerHTML = `
    <div class="file-header">
      <div>
        <div class="file-name">[${statusLabel}] ${escapeHTML(name)}</div>
        <div class="file-meta">${sizeMB} MB</div>
      </div>
      <a href="${url}" download="${escapeHTML(name)}" class="dl-btn">保存 / 開く</a>
    </div>
    ${isImage ? `<img src="${url}" class="preview-img" alt="preview">` : ''}
  `;

  list.prepend(li);
}

function generateQRCode(myId) {
  const qrContainer = document.getElementById("qrcode");
  qrContainer.innerHTML = "";
  const connectUrl = `${window.location.origin}${window.location.pathname}?connect=${myId}`;
  new QRCode(qrContainer, {
    text: connectUrl,
    width: 150,
    height: 150,
    colorDark : "#000000",
    colorLight : "#ffffff",
  });
}

function setupUIEvents() {
  const targetInput = document.getElementById("targetId");
  const connectBtn = document.getElementById("connectBtn");

  // 接続ボタン
  connectBtn.addEventListener("click", () => {
    const targetId = targetInput.value.trim();
    if (targetId.length === 5) connectToPeer(targetId);
    else alert("5桁の数字を入力してください");
  });

  // Enterキーで接続
  targetInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      connectBtn.click();
    }
  });

  // ファイル選択＆ドラッグ＆ドロップ
  const dropZone = document.getElementById("dropZone");
  const fileInput = document.getElementById("fileInput");

  dropZone.addEventListener("click", () => fileInput.click());
  dropZone.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      fileInput.click();
    }
  });
  fileInput.addEventListener("change", (e) => {
    if (e.target.files.length > 0) sendFiles(e.target.files);
    fileInput.value = "";
  });

  dropZone.addEventListener("dragover", (e) => {
    e.preventDefault();
    dropZone.classList.add("dragover");
  });
  dropZone.addEventListener("dragleave", () => dropZone.classList.remove("dragover"));
  dropZone.addEventListener("drop", (e) => {
    e.preventDefault();
    dropZone.classList.remove("dragover");
    if (e.dataTransfer.files.length > 0) sendFiles(e.dataTransfer.files);
  });
}

function escapeHTML(str) {
  return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag]));
}
</script>
</body>
</html>
