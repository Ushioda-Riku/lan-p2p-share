<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>AirShare</title>
  <script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
  <script src="https://unpkg.com/mqtt@5.10.3/dist/mqtt.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --bg-light: #f5f5f7;
      --bg-dark: #000000;
      --card-light: #ffffff;
      --card-dark: #1c1c1e;
      --header-light: rgba(245, 245, 247, 0.82);
      --header-dark: rgba(0, 0, 0, 0.82);
      --fill-light: rgba(120, 120, 128, 0.11);
      --fill-dark: rgba(120, 120, 128, 0.24);
      --text-light: #111111;
      --text-dark: #f5f5f7;
      --subtext-light: rgba(60, 60, 67, 0.62);
      --subtext-dark: rgba(235, 235, 245, 0.6);
      --sep-light: rgba(60, 60, 67, 0.12);
      --sep-dark: rgba(84, 84, 88, 0.42);
      --accent-light: #007aff;
      --accent-dark: #0a84ff;
      --green-light: #28a745;
      --green-dark: #30d158;
      --red-light: #ff3b30;
      --red-dark: #ff453a;
      --amber-light: #ff9500;
      --amber-dark: #ff9f0a;

      --bg: var(--bg-light);
      --card: var(--card-light);
      --header-bg: var(--header-light);
      --fill: var(--fill-light);
      --text: var(--text-light);
      --subtext: var(--subtext-light);
      --sep: var(--sep-light);
      --accent: var(--accent-light);
      --green: var(--green-light);
      --red: var(--red-light);
      --amber: var(--amber-light);
      --target-size: 24px;

      color-scheme: light dark;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: var(--bg-dark);
        --card: var(--card-dark);
        --header-bg: var(--header-dark);
        --fill: var(--fill-dark);
        --text: var(--text-dark);
        --subtext: var(--subtext-dark);
        --sep: var(--sep-dark);
        --accent: var(--accent-dark);
        --green: var(--green-dark);
        --red: var(--red-dark);
        --amber: var(--amber-dark);
      }
    }

    @supports (color: light-dark(white, black)) {
      :root {
        --bg: light-dark(var(--bg-light), var(--bg-dark));
        --card: light-dark(var(--card-light), var(--card-dark));
        --header-bg: light-dark(var(--header-light), var(--header-dark));
        --fill: light-dark(var(--fill-light), var(--fill-dark));
        --text: light-dark(var(--text-light), var(--text-dark));
        --subtext: light-dark(var(--subtext-light), var(--subtext-dark));
        --sep: light-dark(var(--sep-light), var(--sep-dark));
        --accent: light-dark(var(--accent-light), var(--accent-dark));
        --green: light-dark(var(--green-light), var(--green-dark));
        --red: light-dark(var(--red-light), var(--red-dark));
        --amber: light-dark(var(--amber-light), var(--amber-dark));
      }
    }

    @media (pointer: coarse) {
      :root {
        --target-size: 44px;
      }
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Hiragino Sans", "Segoe UI", sans-serif;
      line-height: 1.4;
      overflow-wrap: break-word;
    }

    :where(button, input:not([type="checkbox"], [type="radio"]), [role="button"], .dl-btn) {
      min-block-size: var(--target-size);
      min-inline-size: var(--target-size);
    }

    .svg-icon {
      display: block;
      flex: none;
      pointer-events: none;
    }

    .is-spinning {
      animation: spin 0.9s linear infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      .is-spinning {
        animation: none;
      }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 20;
      padding: max(12px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px));
      background: var(--header-bg);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 0.5px solid var(--sep);
    }

    .header-inner {
      max-width: 420px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
      text-wrap: balance;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      background: var(--fill);
      color: var(--subtext);
      white-space: nowrap;
    }

    .status-pill .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--amber);
    }

    .status-pill.is-ready .dot {
      background: var(--green);
    }

    .status-pill.is-ready {
      color: var(--text);
    }

    main {
      max-width: 452px;
      margin: 0 auto;
      padding: 16px max(16px, env(safe-area-inset-right, 0px)) max(32px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    }

    .card {
      background: var(--card);
      border: 0.5px solid var(--sep);
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 14px;
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }

    .card h2 {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      color: var(--subtext);
      text-wrap: balance;
    }

    .code-row {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .code-box {
      font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
      font-variant-numeric: tabular-nums;
      font-size: 36px;
      font-weight: 700;
      letter-spacing: 8px;
      padding-left: 8px;
      color: var(--text);
      user-select: all;
    }

    .code-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .copy-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
    }

    .pill-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 999px;
      border: 0.5px solid var(--sep);
      background: var(--fill);
      color: var(--accent);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.12s ease;
    }

    .pill-btn:active {
      transform: scale(0.96);
      opacity: 0.75;
    }

    #copyCodeBtn .icon-check {
      display: none;
    }

    #copyCodeBtn[data-copied] .icon-copy {
      display: none;
    }

    #copyCodeBtn[data-copied] .icon-check {
      display: block;
    }

    .copy-tip {
      position: absolute;
      left: 50%;
      bottom: calc(100% + 8px);
      transform: translateX(-50%) translateY(4px);
      background: var(--text);
      color: var(--bg);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.16s ease, transform 0.16s ease;
    }

    .copy-tip.is-visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    #qrcode {
      display: flex;
      justify-content: center;
      align-items: center;
      background: #ffffff;
      padding: 10px;
      border-radius: 14px;
      border: 0.5px solid var(--sep);
      width: fit-content;
      margin: 2px auto 0 auto;
    }

    .connect-row {
      display: flex;
      gap: 8px;
      align-items: stretch;
    }

    .code-input {
      flex: 1;
      min-width: 0;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1.5px solid transparent;
      background: var(--fill);
      color: var(--text);
      font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
      font-variant-numeric: tabular-nums;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 5px;
      text-align: center;
      outline: none;
      transition: border-color 0.16s ease;
    }

    .code-input:focus {
      border-color: var(--accent);
    }

    .code-input::placeholder {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Hiragino Sans", sans-serif;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0;
      color: var(--subtext);
    }

    .btn-primary, .btn-icon {
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.12s ease, opacity 0.12s ease;
    }

    .btn-primary {
      padding: 0 18px;
      background: var(--accent);
      color: #ffffff;
      white-space: nowrap;
    }

    .btn-icon {
      padding: 0 12px;
      background: var(--fill);
      color: var(--text);
    }

    .btn-icon-danger {
      background: rgba(255, 59, 48, 0.12);
      color: var(--red);
    }

    .btn-primary:active, .btn-icon:active {
      transform: scale(0.97);
      opacity: 0.78;
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: default;
    }

    .status-line {
      margin: 10px 0 0 0;
      font-size: 13px;
      color: var(--subtext);
      text-wrap: pretty;
    }

    .status-line.is-error {
      color: var(--red);
    }

    .session-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      min-width: 0;
    }

    .peer-id-label {
      font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
      font-variant-numeric: tabular-nums;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    .mode-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      background: var(--fill);
      color: var(--subtext);
    }

    .mode-chip.is-p2p {
      background: rgba(0, 122, 255, 0.13);
      color: var(--accent);
    }

    .mode-chip.is-relay {
      background: rgba(40, 167, 69, 0.13);
      color: var(--green);
    }

    .mode-chip.is-reconnecting {
      background: rgba(255, 149, 0, 0.15);
      color: var(--amber);
    }

    .mode-chip.is-disconnected {
      background: rgba(255, 59, 48, 0.14);
      color: var(--red);
    }

    .session-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #dropZone {
      border: 1.5px dashed var(--sep);
      border-radius: 14px;
      padding: 28px 16px;
      text-align: center;
      cursor: pointer;
      background: var(--fill);
      color: var(--accent);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: border-color 0.16s ease, opacity 0.16s ease, transform 0.12s ease;
    }

    #dropZone:hover, #dropZone:focus-visible {
      border-color: var(--accent);
      outline: none;
    }

    #dropZone.dragover {
      border-color: var(--accent);
      transform: scale(0.99);
    }

    #dropZone.is-disabled {
      opacity: 0.45;
      pointer-events: none;
    }

    .drop-title {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
    }

    .drop-sub {
      display: none;
      margin: 0;
      font-size: 12px;
      color: var(--subtext);
    }

    @media (hover: hover) {
      .drop-sub {
        display: block;
      }
    }

    #fileInput {
      display: none;
    }

    .progress-container {
      display: none;
      margin-top: 14px;
      padding: 12px;
      border-radius: 12px;
      background: var(--fill);
    }

    .status-text {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-variant-numeric: tabular-nums;
    }

    .status-text span:first-child {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    progress {
      appearance: none;
      border: 0 solid;
      overflow: clip;
      width: 100%;
      height: 6px;
      border-radius: 999px;
      background-color: var(--sep);
    }

    progress::-webkit-progress-bar {
      background-color: transparent;
    }

    progress::-webkit-progress-value {
      background-color: var(--accent);
      border-radius: 999px;
      transition: inline-size 0.15s ease;
    }

    progress::-moz-progress-bar {
      background-color: var(--accent);
      border-radius: 999px;
      transition: inline-size 0.15s ease;
    }

    .file-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .file-item {
      background: var(--fill);
      padding: 12px;
      border-radius: 14px;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .file-item:last-child {
      margin-bottom: 0;
    }

    .file-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .file-info {
      min-width: 0;
      flex: 1 1 160px;
    }

    .file-name {
      font-weight: 600;
      font-size: 14px;
      word-break: break-word;
    }

    .file-meta {
      font-size: 12px;
      color: var(--subtext);
      margin-top: 2px;
    }

    .file-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dl-btn, .share-file-btn {
      border: none;
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .dl-btn {
      background: var(--accent);
      color: #ffffff;
    }

    .share-file-btn {
      background: var(--card);
      color: var(--accent);
      border: 0.5px solid var(--sep);
    }

    .preview-img {
      max-inline-size: 100%;
      block-size: auto;
      max-height: 220px;
      border-radius: 10px;
      object-fit: contain;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <svg hidden aria-hidden="true">
    <symbol id="icon-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <rect x="9" y="9" width="13" height="13" rx="2"/>
      <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
    </symbol>
    <symbol id="icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"/>
    </symbol>
    <symbol id="icon-share" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/>
      <polyline points="16 6 12 2 8 6"/>
      <line x1="12" y1="2" x2="12" y2="15"/>
    </symbol>
    <symbol id="icon-arrow-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="5" y1="12" x2="19" y2="12"/>
      <polyline points="12 5 19 12 12 19"/>
    </symbol>
    <symbol id="icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="18" y1="6" x2="6" y2="18"/>
      <line x1="6" y1="6" x2="18" y2="18"/>
    </symbol>
    <symbol id="icon-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="23 4 23 10 17 10"/>
      <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
    </symbol>
    <symbol id="icon-upload" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
      <polyline points="17 8 12 3 7 8"/>
      <line x1="12" y1="3" x2="12" y2="15"/>
    </symbol>
    <symbol id="icon-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
      <polyline points="7 10 12 15 17 10"/>
      <line x1="12" y1="15" x2="12" y2="3"/>
    </symbol>
    <symbol id="icon-bolt" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
    </symbol>
    <symbol id="icon-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
    </symbol>
  </svg>

  <header class="app-header">
    <div class="header-inner">
      <h1>AirShare</h1>
      <span id="readyPill" class="status-pill" role="status">
        <span class="dot" aria-hidden="true"></span>
        <span id="readyText">準備中</span>
      </span>
    </div>
  </header>

  <main>
    <div id="connectPanel">
      <section class="card" aria-labelledby="myCodeHeading">
        <div class="card-head">
          <h2 id="myCodeHeading">自分のコード</h2>
        </div>
        <div class="code-row">
          <span id="myId" class="code-box">-----</span>
          <div class="code-actions">
            <span class="copy-wrap">
              <button type="button" id="copyCodeBtn" class="pill-btn" aria-label="接続コードをコピー">
                <svg class="svg-icon icon-copy" width="15" height="15" aria-hidden="true"><use href="#icon-copy"></use></svg>
                <svg class="svg-icon icon-check" width="15" height="15" aria-hidden="true"><use href="#icon-check"></use></svg>
                コピー
              </button>
              <span id="copyTip" class="copy-tip" role="status"></span>
            </span>
            <button type="button" id="shareLinkBtn" class="pill-btn hidden" aria-label="接続リンクを共有">
              <svg class="svg-icon" width="15" height="15" aria-hidden="true"><use href="#icon-share"></use></svg>
              共有
            </button>
          </div>
          <div id="qrcode" aria-label="接続用QRコード"></div>
        </div>
      </section>

      <section class="card" aria-labelledby="targetHeading">
        <div class="card-head">
          <h2 id="targetHeading">相手に接続</h2>
        </div>
        <div class="connect-row">
          <input type="tel" id="targetId" class="code-input" placeholder="00000" maxlength="5" pattern="[0-9]*" inputmode="numeric" autocomplete="one-time-code" aria-label="相手の5桁のコード">
          <button type="button" id="connectBtn" class="btn-primary">
            <svg id="connectBtnIcon" class="svg-icon" width="17" height="17" aria-hidden="true"><use href="#icon-arrow-right"></use></svg>
            <span id="connectBtnLabel">接続</span>
          </button>
          <button type="button" id="cancelConnectBtn" class="btn-icon hidden" aria-label="接続をキャンセル">
            <svg class="svg-icon" width="17" height="17" aria-hidden="true"><use href="#icon-close"></use></svg>
          </button>
        </div>
        <p id="connStatus" class="status-line hidden" role="status"></p>
      </section>
    </div>

    <div id="transferPanel" class="hidden">
      <section class="card" aria-labelledby="sendHeading">
        <div class="card-head">
          <div class="session-meta">
            <h2 id="sendHeading" hidden>転送</h2>
            <span id="peerIdLabel" class="peer-id-label">-----</span>
            <span id="modeChip" class="mode-chip" role="status">
              <svg id="modeChipIcon" class="svg-icon" width="13" height="13" aria-hidden="true"><use href="#icon-shield"></use></svg>
              <span id="modeChipText">接続中</span>
            </span>
          </div>
          <div class="session-actions">
            <button type="button" id="reconnectBtn" class="btn-icon hidden" aria-label="再接続">
              <svg class="svg-icon" width="16" height="16" aria-hidden="true"><use href="#icon-refresh"></use></svg>
            </button>
            <button type="button" id="disconnectBtn" class="btn-icon btn-icon-danger" aria-label="接続を終了">
              <svg class="svg-icon" width="16" height="16" aria-hidden="true"><use href="#icon-close"></use></svg>
            </button>
          </div>
        </div>

        <div id="dropZone" role="button" tabindex="0">
          <svg class="svg-icon" width="26" height="26" aria-hidden="true"><use href="#icon-upload"></use></svg>

// === Information-Theoretic Pre-Scan & Adaptive Per-Chunk Deflate ===
function isConstantChunk(bytes) {
  const n = bytes.length;
  if (n < 64) return false;
  const b0 = bytes[0];
  if (bytes[n - 1] !== b0 || bytes[n >>> 1] !== b0 || bytes[n >>> 2] !== b0 || bytes[(n * 3) >>> 2] !== b0) {
    return false;
  }
  for (let i = 1; i < n; i++) {
    if (bytes[i] !== b0) return false;
  }
  return true;
}

function estimateShannonEntropy(bytes) {
  const n = bytes.length;
  if (n === 0) return 8.0;
  ENTROPY_HIST.fill(0);
  const step = n > 2048 ? Math.floor(n / 2048) : 1;
  let samples = 0;
  for (let i = 0; i < n; i += step) {
    ENTROPY_HIST[bytes[i]] += 1;
    samples += 1;
  }
  let h = 0;
  const invN = 1 / samples;
  for (let i = 0; i < 256; i++) {
    const c = ENTROPY_HIST[i];
    if (c > 0) {
      const p = c * invN;
      h -= p * Math.log2(p);
    }
  }
  return h;
}

async function runStreamTransform(bytes, ctor) {
  const cs = new ctor("deflate-raw");
  const writer = cs.writable.getWriter();
  writer.write(bytes);
  writer.close();
  const reader = cs.readable.getReader();
  const parts = [];
  let total = 0;
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    parts.push(value);
    total += value.byteLength;
  }
  const out = new Uint8Array(total);
  let off = 0;
  for (let i = 0; i < parts.length; i++) {
    out.set(parts[i], off);
    off += parts[i].byteLength;
  }
  return out;
}

async function prepareOutgoingPayload(chunkBytes, canDeflate) {
  if (isConstantChunk(chunkBytes)) {
    const sparse = new Uint8Array(5);
    sparse[0] = chunkBytes[0];
    new DataView(sparse.buffer).setUint32(1, chunkBytes.length, false);
    return { frameType: 0x04, body: sparse };
  }
  if (canDeflate && chunkBytes.length >= 512) {
    const h = estimateShannonEntropy(chunkBytes);
    if (h < 7.20) {
      try {
        const compressed = await runStreamTransform(chunkBytes, CompressionStream);
        if (compressed.byteLength < chunkBytes.length * 0.92) {
          return { frameType: 0x03, body: compressed };
        }
      } catch {}
    }
  }
  return { frameType: 0x02, body: chunkBytes };
}

// === Web Crypto (ECDH P-256 + AES-256-GCM + TLS 1.3 Deterministic XOR-Nonce AEAD) ===
function bytesToBase64(bytes) {
  let bin = "";
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}

function base64ToBytes(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

async function initCrypto() {
  if (!window.crypto || !crypto.subtle) return;
  myKeyPair = await crypto.subtle.generateKey(
    { name: "ECDH", namedCurve: "P-256" },
    true,
    ["deriveKey"]
  );
  const rawPub = await crypto.subtle.exportKey("raw", myKeyPair.publicKey);
  myPubKeyB64 = bytesToBase64(new Uint8Array(rawPub));
}

async function deriveAesKey(remotePubB64) {
  await cryptoInitPromise;
  if (!crypto.subtle || !myKeyPair || !remotePubB64) return null;
  const remotePub = await crypto.subtle.importKey(
    "raw",
    base64ToBytes(remotePubB64),
    { name: "ECDH", namedCurve: "P-256" },
    false,
    []
  );
  return crypto.subtle.deriveKey(
    { name: "ECDH", public: remotePub },
    myKeyPair.privateKey,
    { name: "AES-GCM", length: 256 },
    false,
    ["encrypt", "decrypt"]
  );
}

async function encryptControlPacket(plainUint8) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const encrypted = new Uint8Array(
    await crypto.subtle.encrypt({ name: "AES-GCM", iv }, sharedAesKey, plainUint8)
  );
  const packet = new Uint8Array(1 + 12 + encrypted.length);
  packet[0] = 0x01;
  packet.set(iv, 1);
  packet.set(encrypted, 13);
  return packet;
}

async function decryptControlPacket(bytes) {
  const iv = bytes.slice(1, 13);
  const ciphertext = bytes.slice(13);
  const plainBuf = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, sharedAesKey, ciphertext);
  return new Uint8Array(plainBuf);
}

function deriveChunkNonce(salt, seq, attemptGen) {
  const iv = new Uint8Array(salt);
  iv[7] ^= (attemptGen & 0xff);
  const view = new DataView(iv.buffer, iv.byteOffset, iv.byteLength);
  view.setUint32(8, (view.getUint32(8, false) ^ seq) >>> 0, false);
  return iv;
}

async function encryptChunkWithXorNonce(salt, frameType, seq, sentMs32, attemptGen, txSlot, bodyBytes) {
  const header = new Uint8Array(11);
  header[0] = frameType;
  const hView = new DataView(header.buffer);
  hView.setUint32(1, seq, false);
  hView.setUint32(5, sentMs32 >>> 0, false);
  header[9] = attemptGen & 0xff;
  header[10] = txSlot & 0xff;

  const iv = deriveChunkNonce(salt, seq, attemptGen);
  const encrypted = new Uint8Array(
    await crypto.subtle.encrypt({ name: "AES-GCM", iv, additionalData: header }, sharedAesKey, bodyBytes)
  );
  const packet = new Uint8Array(11 + encrypted.length);
  packet.set(header, 0);
  packet.set(encrypted, 11);
  return packet;
}

async function decryptChunkWithXorNonce(salt, bytes) {
  const header = bytes.subarray(0, 11);
  const frameType = bytes[0];
  const hView = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  const seq = hView.getUint32(1, false);
  const sentMs32 = hView.getUint32(5, false);
  const attemptGen = bytes[9];
  const txSlot = bytes[10];
  const ciphertext = bytes.subarray(11);
  const iv = deriveChunkNonce(salt, seq, attemptGen);
  const plainBuf = await crypto.subtle.decrypt({ name: "AES-GCM", iv, additionalData: header }, sharedAesKey, ciphertext);
  return { frameType, seq, sentMs32, txSlot, body: new Uint8Array(plainBuf) };
}

// === Dual-Broker Simultaneous WSS Signaling & Multipath Relay ===
function mqttSubscribeSlot(slot, topic, opts = { qos: 1 }) {
  return new Promise((resolve, reject) => {
    if (!slot.client) return reject(new Error("MQTT unavailable"));
    slot.client.subscribe(topic, opts, (err) => (err ? reject(err) : resolve()));
  });
}

function mqttPublishSlot(slot, topic, payload, opts = { qos: 1 }) {
  return new Promise((resolve, reject) => {
    if (!slot.client || !slot.client.connected) return reject(new Error("MQTT offline"));
    slot.client.publish(topic, payload, opts, (err) => (err ? reject(err) : resolve()));
  });
}

function startAllBrokers() {
  for (const slot of brokerSlots) {
    startBrokerSlot(slot);
  }
}

function startBrokerSlot(slot) {
  if (typeof mqtt === "undefined") return;
  const brokerUrl = MQTT_BROKERS[slot.brokerIdx % MQTT_BROKERS.length];
  let settled = false;

  const client = mqtt.connect(brokerUrl, {
    clientId: `airshare_${myId}_${slot.id}_${Math.random().toString(16).slice(2, 7)}`,
    clean: true,
    connectTimeout: 4500,
    reconnectPeriod: 2000,
    keepalive: 25
  });
  slot.client = client;

  const failoverTimer = setTimeout(() => {
    if (!settled && slot.client === client) {
      settled = true;
      try { client.end(true); } catch {}
      slot.brokerIdx = (nextFailoverBrokerIdx++) % MQTT_BROKERS.length;
      startBrokerSlot(slot);
    }
  }, 5000);

  client.on("connect", async () => {
    if (slot.client !== client) return;
    settled = true;
    clearTimeout(failoverTimer);
    slot.ready = true;
    updateReadyIndicator();

    const inbox = `lanp2p-v2/inbox/${myId}`;
    currentInboxTopic = inbox;
    try {
      await mqttSubscribeSlot(slot, inbox, { qos: 1 });
      if (relayInTopic) {
        await mqttSubscribeSlot(slot, relayInTopic, { qos: 1 });
      }
      if (connectingTargetId && !isRelayReady) {
        sendMqttOffer("hello", connectingTargetId, currentAttemptId);
      } else if (pairedPeerId && !isRelayReady && currentAttemptId) {
        sendMqttOffer("reconnect", pairedPeerId, currentAttemptId);
      }
    } catch {}
  });

  client.on("message", (topic, payload) => {
    if (topic === currentInboxTopic) {
      const bytes = new Uint8Array(payload.buffer, payload.byteOffset, payload.byteLength);
      try {
        handleInboxMessage(JSON.parse(textDecoder.decode(bytes)));
      } catch {}
      return;
    }
    if (relayInTopic && topic === relayInTopic) {
      handleEncryptedRelayPacket(payload);
    }
  });

  const onDrop = () => {
    if (slot.client !== client) return;
    slot.ready = false;
    slot.inflight = 0;
    if (!hasAnyMqttReady()) {
      isRelayReady = false;
      updateReadyIndicator();
      if (pairedPeerId) {
        if (hasOpenP2P()) {
          updateTransferStatus();
        } else if (connState === "connected") {
          startAutoReconnect(false);
        }
      }
    }
  };

  client.on("offline", onDrop);
  client.on("close", onDrop);

  client.on("error", () => {
    if (!settled && slot.client === client) {
      settled = true;
      clearTimeout(failoverTimer);
      try { client.end(true); } catch {}
      slot.brokerIdx = (nextFailoverBrokerIdx++) % MQTT_BROKERS.length;
      startBrokerSlot(slot);
    }
  });
}

async function subscribeAllBrokers(topic) {
  const ready = getReadyBrokers();
  await Promise.all(ready.map((s) => mqttSubscribeSlot(s, topic, { qos: 1 }).catch(() => {})));
}

async function publishOnBestBroker(topic, payload, opts = { qos: 1 }) {
  const ready = getReadyBrokers();
  if (ready.length === 0) throw new Error("No MQTT broker ready");
  let best = ready[0];
  for (let i = 1; i < ready.length; i++) {
    if (ready[i].inflight < best.inflight) best = ready[i];
  }
  return mqttPublishSlot(best, topic, payload, opts);
}

async function sendMqttOffer(kind, targetId, attemptId) {
  await cryptoInitPromise;
  if (!hasAnyMqttReady() || !myPubKeyB64 || !targetId || !attemptId) return;
  try {
    await publishOnBestBroker(
      `lanp2p-v2/inbox/${targetId}`,
      JSON.stringify({ kind, from: myId, pubKey: myPubKeyB64, attemptId }),
      { qos: 1 }
    );
  } catch {}
}

async function handleInboxMessage(msg) {
  if (!msg || !msg.kind || !msg.from) return;

  if (msg.kind === "hello" || msg.kind === "reconnect") {
    const dedupKey = `${msg.kind}:${msg.from}:${msg.attemptId}`;
    if (seenAttemptIds.has(dedupKey)) return;
    const activeTarget = connectingTargetId || pairedPeerId;
    if (pairedPeerId && pairedPeerId !== msg.from) {
      publishOnBestBroker(`lanp2p-v2/inbox/${msg.from}`, JSON.stringify({ kind: "busy", from: myId }), { qos: 1 }).catch(() => {});
      return;
    }
    if ((connState === "connecting" || connState === "reconnecting") && activeTarget === msg.from && currentAttemptId) {
      if (myId > msg.from) return;
    }
    seenAttemptIds.add(dedupKey);
    try {
      await cryptoInitPromise;
      sharedAesKey = await deriveAesKey(msg.pubKey);
      const nextIn = `lanp2p-v2/stream/${msg.attemptId}/from-${msg.from}`;
      const nextOut = `lanp2p-v2/stream/${msg.attemptId}/from-${myId}`;
      if (relayInTopic && relayInTopic !== nextIn) {
        for (const s of brokerSlots) {
          if (s.client) { try { s.client.unsubscribe(relayInTopic); } catch {} }
        }
      }
      relayInTopic = nextIn;
      relayOutTopic = nextOut;
      currentAttemptId = msg.attemptId;
      await subscribeAllBrokers(relayInTopic);
      await publishOnBestBroker(
        `lanp2p-v2/inbox/${msg.from}`,
        JSON.stringify({ kind: "hello-ack", from: myId, pubKey: myPubKeyB64, attemptId: msg.attemptId }),
        { qos: 1 }
      );
      isRelayReady = true;
      enterConnectedState(msg.from, "relay");
    } catch {}
  } else if (msg.kind === "hello-ack") {
    const expectedPeer = connectingTargetId || pairedPeerId;
    const ackKey = `ack:${msg.from}:${msg.attemptId}`;
    if (msg.attemptId !== currentAttemptId || msg.from !== expectedPeer || seenAttemptIds.has(ackKey)) return;
    seenAttemptIds.add(ackKey);
    try {
      sharedAesKey = await deriveAesKey(msg.pubKey);
      const nextIn = `lanp2p-v2/stream/${msg.attemptId}/from-${msg.from}`;
      const nextOut = `lanp2p-v2/stream/${msg.attemptId}/from-${myId}`;
      if (relayInTopic && relayInTopic !== nextIn) {
        for (const s of brokerSlots) {
          if (s.client) { try { s.client.unsubscribe(relayInTopic); } catch {} }
        }
      }
      relayInTopic = nextIn;
      relayOutTopic = nextOut;
      await subscribeAllBrokers(relayInTopic);
      isRelayReady = true;
      enterConnectedState(msg.from, "relay");
    } catch {}
  } else if (msg.kind === "busy") {
    if (msg.from === connectingTargetId) {
      cancelPendingConnection("相手は別の端末と接続中です", true);
    }
  } else if (msg.kind === "bye") {
    if (msg.from === pairedPeerId || msg.from === connectingTargetId) {
      resetToConnectPanel("相手が接続を終了しました");
    }
  }
}

// === 3-Association Parallel WebRTC Raw Striping ===
function initPeerJS() {
  if (typeof Peer === "undefined") return;
  peer = new Peer(PEER_PREFIX + myId, {
    debug: 1,
    config: {
      iceServers: [
        { urls: "stun:stun.l.google.com:19302" },
        { urls: "stun:stun.cloudflare.com:3478" }
      ]
    }
  });

  peer.on("open", () => {
    peerReady = true;
    updateReadyIndicator();
    const target = connectingTargetId || pairedPeerId;
    if (target && !hasOpenP2P()) {
      firePeerConnect(target);
    }
  });

  peer.on("connection", (conn) => {
    attachWebRtcConn(conn);
  });

  peer.on("error", (err) => {
    if (err.type === "unavailable-id") {
      try { peer.destroy(); } catch {}
      peerReady = false;
      myId = generateCode();
      sessionStorage.setItem(STORAGE_MY_ID, myId);
      renderMyCode(myId);
      if (hasAnyMqttReady()) {
        const oldInbox = currentInboxTopic;
        currentInboxTopic = `lanp2p-v2/inbox/${myId}`;
        if (oldInbox) {
          for (const s of brokerSlots) {
            if (s.client) { try { s.client.unsubscribe(oldInbox); } catch {} }
          }
        }
        subscribeAllBrokers(currentInboxTopic).catch(() => {});
      }
      initPeerJS();
      return;
    }
    if (err.type === "peer-unavailable") {
      if (!hasAnyMqttReady() && !isRelayReady && connState === "connecting") {
        cancelPendingConnection("相手が見つかりませんでした", true);
      }
    }
  });
}

function firePeerConnect(targetId) {
  if (!peer || !peerReady || !targetId) return;
  for (const label of P2P_LANES) {
    const existing = p2pLanes.get(label);
    if (existing && (existing.open || existing.peerConnection?.iceConnectionState === "checking")) continue;
    try {
      const conn = peer.connect(PEER_PREFIX + targetId, { reliable: true, serialization: "raw", label });
      attachWebRtcConn(conn);
    } catch {}
  }
}

function attachWebRtcConn(conn) {
  const remoteId = conn.peer.replace(PEER_PREFIX, "");
  const laneKey = conn.label || "stripe-0";
  if (pairedPeerId && pairedPeerId !== remoteId) {
    conn.close();
    return;
  }
  const prev = p2pLanes.get(laneKey);
  if (prev && prev.open && prev !== conn) {
    conn.close();
    return;
  }
  p2pLanes.set(laneKey, conn);

  const configureDc = () => {
    if (conn.dataChannel) {
      conn.dataChannel.binaryType = "arraybuffer";
      conn.dataChannel.bufferedAmountLowThreshold = P2P_LOW_WATER;
    }
  };
  configureDc();

  const onOpen = () => {
    configureDc();
    isDirectP2P = true;
    clearSilentP2PRetry();
    enterConnectedState(remoteId, "p2p");
  };

  if (conn.open) {
    onOpen();
  } else {
    conn.on("open", onOpen);
  }

  conn.on("data", (raw) => {
    if (raw instanceof ArrayBuffer) {
      handleP2PRawPacket(new Uint8Array(raw));
      return;
    }
    if (ArrayBuffer.isView(raw)) {
      handleP2PRawPacket(new Uint8Array(raw.buffer, raw.byteOffset, raw.byteLength));
      return;
    }
    if (raw instanceof Blob) {
      p2pRecvChain = p2pRecvChain
        .then(async () => handleP2PRawPacket(new Uint8Array(await raw.arrayBuffer())))
        .catch((err) => console.error("P2P recv error:", err));
    }
  });

  if (conn.peerConnection) {
    conn.peerConnection.addEventListener("iceconnectionstatechange", () => {
      const state = conn.peerConnection.iceConnectionState;
      if ((state === "disconnected" || state === "failed") && p2pLanes.get(laneKey) === conn) {
        handleWebRtcDrop(laneKey, conn);
      }
    });
  }

  conn.on("close", () => handleWebRtcDrop(laneKey, conn));
  conn.on("error", () => handleWebRtcDrop(laneKey, conn));
}

function handleWebRtcDrop(laneKey, conn) {
  if (p2pLanes.get(laneKey) !== conn) return;
  p2pLanes.delete(laneKey);
  isDirectP2P = hasOpenP2P();
  if (!pairedPeerId || isDirectP2P) return;

  if (isRelayReady && hasAnyMqttReady()) {
    updateTransferStatus();
    scheduleSilentP2PRetry();
  } else {
    startAutoReconnect(false);
  }
}

function clearSilentP2PRetry() {
  if (silentP2PRetryTimer) {
    clearTimeout(silentP2PRetryTimer);
    silentP2PRetryTimer = null;
  }
}

function scheduleSilentP2PRetry() {
  clearSilentP2PRetry();
  silentP2PRetryTimer = setTimeout(() => {
    if (pairedPeerId && !hasOpenP2P() && peerReady) {
      firePeerConnect(pairedPeerId);
    }
  }, 4000);
}

// === Connection & Auto-Reconnect Lifecycle ===
function clearConnectionTimers() {
  if (connectTimeoutTimer) {
    clearTimeout(connectTimeoutTimer);
    connectTimeoutTimer = null;
  }
  retryHelloTimers.forEach((id) => clearTimeout(id));
  retryHelloTimers = [];
  if (reconnectTimer) {
    clearTimeout(reconnectTimer);
    reconnectTimer = null;
  }
}

function connectToPeer(rawTargetId) {
  const targetId = normalizeCode(rawTargetId);
  if (targetId.length !== 5) {
    setConnStatus("5桁の数字を入力してください", true);
    return;
  }
  if (targetId === myId) {
    setConnStatus("自分のコードには接続できません", true);
    return;
  }

  clearConnectionTimers();
  connState = "connecting";
  connectingTargetId = targetId;
  currentAttemptId = crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(16).slice(2)}`;

  setConnectingUI(true);
  setConnStatus(`${targetId} に接続しています`);
  updateReadyIndicator();

  if (hasAnyMqttReady()) sendMqttOffer("hello", targetId, currentAttemptId);
  if (peerReady) firePeerConnect(targetId);

  retryHelloTimers.push(
    setTimeout(() => {
      if (connState === "connecting" && connectingTargetId === targetId && !isRelayReady) {
        sendMqttOffer("hello", targetId, currentAttemptId);
      }
    }, 2500),
    setTimeout(() => {
      if (connState === "connecting" && connectingTargetId === targetId && !isRelayReady) {
        sendMqttOffer("hello", targetId, currentAttemptId);
      }
    }, 6000)
  );

  connectTimeoutTimer = setTimeout(() => {
    if (connState === "connecting" && connectingTargetId === targetId && !pairedPeerId) {
      cancelPendingConnection("相手が見つかりませんでした", true);
    }
  }, CONNECT_TIMEOUT_MS);
}

function cancelPendingConnection(statusText = "", isError = false) {
  clearConnectionTimers();
  connState = "idle";
  connectingTargetId = null;
  currentAttemptId = null;
  for (const conn of p2pLanes.values()) {
    if (!conn.open) {
      try { conn.close(); } catch {}
    }
  }
  p2pLanes.clear();
  setConnectingUI(false);
  setConnStatus(statusText, isError);
  updateReadyIndicator();
}

function startAutoReconnect(resetBackoff = false) {
  if (!pairedPeerId) return;
  if (hasLiveTransport()) {
    enterConnectedState(pairedPeerId, hasOpenP2P() ? "p2p" : "relay");
    return;
  }
  if (connState === "reconnecting" && !resetBackoff) return;

  clearConnectionTimers();
  if (resetBackoff) reconnectAttempt = 0;

  const scheduleNext = () => {
    if (!pairedPeerId || hasLiveTransport()) return;
    if (reconnectAttempt >= MAX_RECONNECT_ATTEMPTS) {
      connState = "disconnected";
      updateTransferStatus();
      updateReadyIndicator();
      return;
    }

    const delay = RECONNECT_DELAYS[Math.min(reconnectAttempt, RECONNECT_DELAYS.length - 1)];
    reconnectAttempt += 1;
    connState = "reconnecting";
    updateTransferStatus();
    updateReadyIndicator();

    reconnectTimer = setTimeout(() => {
      if (!pairedPeerId || hasLiveTransport()) return;
      wakeTransports();
      currentAttemptId = crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(16).slice(2)}`;
      if (hasAnyMqttReady()) sendMqttOffer("reconnect", pairedPeerId, currentAttemptId);
      if (peerReady) firePeerConnect(pairedPeerId);

      reconnectTimer = setTimeout(scheduleNext, 3500);
    }, delay);
  };

  scheduleNext();
}

function ensureConnected(timeoutMs = 10000) {
  if (hasLiveTransport()) return Promise.resolve();
  if (!pairedPeerId) return Promise.reject(new Error("未接続"));
  wakeTransports();
  startAutoReconnect(true);

  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => {
      connectedWaiters = connectedWaiters.filter((w) => w !== waiter);
      reject(new Error("再接続がタイムアウトしました"));
    }, timeoutMs);

    const waiter = {
      resolve: () => { clearTimeout(timer); resolve(); },
      reject: (err) => { clearTimeout(timer); reject(err); }
    };
    connectedWaiters.push(waiter);
  });
}

function enterConnectedState(remoteId, mode) {
  clearConnectionTimers();
  connectingTargetId = null;
  pairedPeerId = remoteId;
  sessionStorage.setItem(STORAGE_PAIRED_PEER, remoteId);
  connState = "connected";
  reconnectAttempt = 0;

  if (mode === "p2p") isDirectP2P = true;
  if (mode === "relay") isRelayReady = true;

  setConnectingUI(false);
  document.getElementById("connectPanel").classList.add("hidden");
  document.getElementById("transferPanel").classList.remove("hidden");
  document.getElementById("peerIdLabel").textContent = remoteId;

  updateTransferStatus();
  updateReadyIndicator();

  while (connectedWaiters.length > 0) {
    connectedWaiters.shift().resolve();
  }

  for (const tx of outgoingTransfers.values()) {
    if (tx.onTransportRecovered) tx.onTransportRecovered();
  }

  if (window.location.search) {
    window.history.replaceState({}, document.title, window.location.pathname);
  }
}

function updateTransferStatus() {
  const chip = document.getElementById("modeChip");
  const chipIconUse = document.querySelector("#modeChipIcon use");
  const chipIconSvg = document.getElementById("modeChipIcon");
  const chipText = document.getElementById("modeChipText");
  const reconnectBtn = document.getElementById("reconnectBtn");
  const dropZone = document.getElementById("dropZone");

  chip.className = "mode-chip";
  chipIconSvg.classList.remove("is-spinning");

  if (connState === "connected" && isDirectP2P) {
    chip.classList.add("is-p2p");
    chipIconUse.setAttribute("href", "#icon-bolt");
    chipText.textContent = "P2P";
    reconnectBtn.classList.add("hidden");
    dropZone.classList.remove("is-disabled");
  } else if (connState === "connected" && isRelayReady) {
    chip.classList.add("is-relay");
    chipIconUse.setAttribute("href", "#icon-shield");
    chipText.textContent = "暗号化";
    reconnectBtn.classList.add("hidden");
    dropZone.classList.remove("is-disabled");
  } else if (connState === "reconnecting") {
    chip.classList.add("is-reconnecting");
    chipIconUse.setAttribute("href", "#icon-refresh");
    chipIconSvg.classList.add("is-spinning");
    chipText.textContent = `再接続中 ${reconnectAttempt}/${MAX_RECONNECT_ATTEMPTS}`;
    reconnectBtn.classList.remove("hidden");
    dropZone.classList.add("is-disabled");
  } else {
    chip.classList.add("is-disconnected");
    chipIconUse.setAttribute("href", "#icon-close");
    chipText.textContent = "切断";
    reconnectBtn.classList.remove("hidden");
    dropZone.classList.add("is-disabled");
  }
}

function resetToConnectPanel(statusMsg = "") {
  clearConnectionTimers();
  clearSilentP2PRetry();
  connState = "idle";
  connectingTargetId = null;
  pairedPeerId = null;
  currentAttemptId = null;
  reconnectAttempt = 0;
  isDirectP2P = false;
  isRelayReady = false;
  sharedAesKey = null;

  sessionStorage.removeItem(STORAGE_PAIRED_PEER);

  if (relayInTopic) {
    for (const s of brokerSlots) {
      if (s.client) { try { s.client.unsubscribe(relayInTopic); } catch {} }
    }
  }
  relayInTopic = "";
  relayOutTopic = "";

  for (const conn of p2pLanes.values()) {
    try { conn.close(); } catch {}
  }
  p2pLanes.clear();

  for (const tx of outgoingTransfers.values()) {
    tx.abort(new Error("Disconnected"));
  }
  outgoingTransfers.clear();
  incomingTransfers.clear();
  txSlotMap.clear();
  earlyRelayChunks.length = 0;
  legacyRecvId = null;

  while (connectedWaiters.length > 0) {
    connectedWaiters.shift().reject(new Error("Disconnected"));
  }

  document.getElementById("sendProgressBox").style.display = "none";
  document.getElementById("recvProgressBox").style.display = "none";
  document.getElementById("transferPanel").classList.add("hidden");
  document.getElementById("connectPanel").classList.remove("hidden");
  setConnectingUI(false);
  setConnStatus(statusMsg, false);
  updateReadyIndicator();
}

// === rAF Progress UI Coalescing ===
function scheduleSendUi(name, bytesDone, totalBytes, startedAt) {

  if (sendRafScheduled) return;

    document.getElementById("sendProgress").value = pct;

  });
}

// === 1 MB Async Slab Read-Ahead with Synchronous Cache Hit ===
function createSlabReader(file, chunkSize) {
  const slabChunks = Math.max(1, Math.floor(SLAB_SIZE / chunkSize));
  const slabBytes = slabChunks * chunkSize;
  const promiseCache = new Map();
  const resolvedCache = new Map();
  let nextPrefetchIdx = -1;

  function loadSlab(slabIdx) {
    if (promiseCache.has(slabIdx)) return promiseCache.get(slabIdx);
    const start = slabIdx * slabBytes;
    if (start >= file.size) return null;
    const end = Math.min(file.size, start + slabBytes);
    const p = file.slice(start, end).arrayBuffer().then((ab) => {
      const u8 = new Uint8Array(ab);
      resolvedCache.set(slabIdx, u8);
      return u8;
    });
    promiseCache.set(slabIdx, p);
    return p;
  }

  function prefetchNext(slabIdx) {
    if (slabIdx + 1 > nextPrefetchIdx) {
      nextPrefetchIdx = slabIdx + 1;
      loadSlab(nextPrefetchIdx);
    }
    for (const k of promiseCache.keys()) {
      if (k < slabIdx - 1) {
        promiseCache.delete(k);
        resolvedCache.delete(k);
      }
    }
  }

  return {
    getChunkSync(seq) {
      const start = seq * chunkSize;
      if (start >= file.size) return new Uint8Array(0);
      const slabIdx = Math.floor(start / slabBytes);
      const slab = resolvedCache.get(slabIdx);
      if (!slab) return null;
      prefetchNext(slabIdx);
      const inSlabOffset = start - slabIdx * slabBytes;
      const len = Math.min(chunkSize, file.size - start);
      return slab.subarray(inSlabOffset, inSlabOffset + len);
    },
    async getChunk(seq) {
      const sync = this.getChunkSync(seq);
      if (sync) return sync;
      const start = seq * chunkSize;
      if (start >= file.size) return new Uint8Array(0);
      const slabIdx = Math.floor(start / slabBytes);
      const slab = await loadSlab(slabIdx);
      prefetchNext(slabIdx);
      const inSlabOffset = start - slabIdx * slabBytes;
      const len = Math.min(chunkSize, file.size - start);
      return slab.subarray(inSlabOffset, inSlabOffset + len);
    }
  };
}

// === Multipath ECF Scheduler, Tail Cloning, Mid-File P2P Cutover & Resume ===
function buildControlFrame(obj) {
  const jsonBytes = textEncoder.encode(JSON.stringify(obj));
  const frame = new Uint8Array(1 + jsonBytes.length);
  frame[0] = 0x01;
  frame.set(jsonBytes, 1);
  return frame;
}

function buildP2PChunkFrame(frameType, seq, bodyBytes, sentMs32, attemptGen, txSlot) {
  const frame = new Uint8Array(11 + bodyBytes.length);
  frame[0] = frameType;
  const view = new DataView(frame.buffer);
  view.setUint32(1, seq, false);
  view.setUint32(5, sentMs32 >>> 0, false);
  frame[9] = attemptGen & 0xff;
  frame[10] = txSlot & 0xff;
  frame.set(bodyBytes, 11);
  return frame;
}

function sendControlMessage(obj, preferP2P = true) {
  const frame = buildControlFrame(obj);
  if (preferP2P && hasOpenP2P()) {
    const lane = pickLowestBufferedP2PLane();
    if (lane) {
      try {
        lane.send(frame);
        return Promise.resolve();
      } catch {}
    }
  }
  if (isRelayReady && hasAnyMqttReady()) {
    return encryptControlPacket(frame)
      .then((pkt) => publishOnBestBroker(relayOutTopic, pkt, { qos: 1 }))
      .catch(() => {});
  }
  return Promise.resolve();
}

function pickLowestBufferedP2PLane() {
  let best = null;
  let bestBuf = Infinity;
  for (const conn of p2pLanes.values()) {
    if (!conn || !conn.open) continue;
    const b = conn.dataChannel ? conn.dataChannel.bufferedAmount : 0;
    if (b < bestBuf) {
      bestBuf = b;
      best = conn;
    }
  }
  return best;
}

function waitForAnyP2PLaneLow() {
  const lanes = getOpenP2PLanes();
  if (lanes.length === 0) return Promise.resolve();
  return new Promise((resolve) => {
    let done = false;
    const cleanups = [];
    const finish = () => {
      if (done) return;
      done = true;
      clearTimeout(timer);
      for (const fn of cleanups) fn();
      resolve();
    };
    const timer = setTimeout(finish, 40);
    for (const conn of lanes) {
      const dc = conn.dataChannel;
      if (!dc) continue;
      if (dc.bufferedAmount < P2P_HIGH_WATER) {
        finish();
        return;
      }
      if (typeof dc.addEventListener === "function") {
        dc.addEventListener("bufferedamountlow", finish);
        cleanups.push(() => dc.removeEventListener && dc.removeEventListener("bufferedamountlow", finish));
      }
    }
  });
}

function sendFiles(files, onAfterDone) {
  if (!pairedPeerId) return;
  const fileArray = Array.from(files);
  sendQueue = sendQueue
    .then(() => processSendQueue(fileArray))
    .catch((err) => {
      console.error(err);
      document.getElementById("sendProgressBox").style.display = "none";
    })
    .finally(() => {
      if (typeof onAfterDone === "function") onAfterDone();
    });
}

async function processSendQueue(files) {
  const progressBox = document.getElementById("sendProgressBox");
  progressBox.style.display = "block";

  for (let idx = 0; idx < files.length; idx++) {
    const file = files[idx];
    await ensureConnected(10000);

    const startedAt = nowMs();
    scheduleSendUi(file.name, 0, file.size, startedAt);
    await sendFileUnified(file, startedAt);
    addFileToList(file.name, file.size, file.type, file, "送信");
  }

  setTimeout(() => { progressBox.style.display = "none"; }, 1400);
}

function getNegotiatedP2PChunkSize() {
  let minMaxMsg = 65536;
  for (const conn of getOpenP2PLanes()) {
    const m = conn.peerConnection?.sctp?.maxMessageSize;
    if (typeof m === "number" && m > 0) minMaxMsg = Math.min(minMaxMsg, m);
  }
  return minMaxMsg >= 65536 ? 63 * 1024 : 16 * 1024;
}

function pickEcfBrokerSlot(excludeSlotId = -1) {
  const ready = getReadyBrokers();
  let best = null;
  let bestScore = Infinity;
  for (const slot of ready) {
    if (slot.id === excludeSlotId) continue;
    if (slot.inflight >= slot.cwnd) continue;
    const score = ((slot.inflight + 1) * slot.ewmaRtt) / Math.max(1, slot.cwnd);
    if (score < bestScore) {
      bestScore = score;
      best = slot;
    }
  }
  return best;
}

async function sendFileUnified(file, startedAt) {
  const transferId = `${Date.now()}_${Math.random().toString(16).slice(2, 8)}`;
  const txSlot = (nextTxSlot++) & 0xff;
  const startedOnP2P = hasOpenP2P();
  const chunkSize = startedOnP2P ? getNegotiatedP2PChunkSize() : RELAY_CHUNK_SIZE;
  const totalChunks = file.size === 0 ? 0 : Math.ceil(file.size / chunkSize);
  const salt = crypto.getRandomValues(new Uint8Array(12));
  const localSlotInflight = new Int32Array(brokerSlots.length);

  const txState = {
    transferId,
    txSlot,
    salt,
    cumSeq: -1,
    highestSacked: -1,
    acked: new Uint8Array(totalChunks),
    sentAt: new Float64Array(totalChunks),
    sentSlot: new Int8Array(totalChunks).fill(-1),
    txCount: new Uint8Array(totalChunks),
    tailCloned: new Uint8Array(totalChunks),
    wake: null,
    donePromise: null,
    resolveDone: null,
    rejectDone: null,
    abort(err) { if (this.rejectDone) this.rejectDone(err); },
    onTransportRecovered() {
      if (totalChunks > 0 && this.cumSeq < totalChunks - 1) {
        sendControlMessage({ type: "resume-query", transferId }, hasOpenP2P()).catch(() => {});
      }
      if (this.wake) {
        const fn = this.wake;
        this.wake = null;
        fn();
      }
    },
    onSack(msg) {
      const now = nowMs();
      const cum = Math.min(totalChunks - 1, msg.cumSeq);

      const creditSlot = (seq, rttSample) => {
        const sid = this.sentSlot[seq];
        if (sid >= 0 && sid < brokerSlots.length) {
          const slot = brokerSlots[sid];
          if (localSlotInflight[sid] > 0) {
            localSlotInflight[sid] -= 1;
            slot.inflight = Math.max(0, slot.inflight - 1);
          }
          if (rttSample >= 1 && rttSample < 15000) {
            slot.minRtt = Math.min(slot.minRtt, rttSample);
            slot.ewmaRtt = slot.ewmaRtt * 0.8 + rttSample * 0.2;
            if (rttSample > slot.minRtt * 1.45 + 25 && now - slot.lastCongestionAt > slot.minRtt) {
              slot.lastCongestionAt = now;
              slot.inflightHi = Math.max(12, Math.floor(slot.cwnd * 0.85));
              slot.cwnd = Math.max(12, Math.min(slot.cwnd, slot.inflightHi));
            } else {
              slot.cwnd = Math.min(slot.inflightHi, slot.cwnd + 1);
            }
          } else {
            slot.cwnd = Math.min(slot.inflightHi, slot.cwnd + 1);
          }
        }
      };

      const rttSample = typeof msg.echoTs === "number" && msg.echoTs > 0
        ? ((Math.floor(now) - msg.echoTs) >>> 0)
        : 0;

      if (cum > this.cumSeq) {
        for (let s = this.cumSeq + 1; s <= cum; s++) {
          if (!this.acked[s]) {
            this.acked[s] = 1;
            creditSlot(s, rttSample);
          }
        }
        this.cumSeq = cum;
        this.highestSacked = Math.max(this.highestSacked, cum);
      }

      const hi = msg.bitmapHi >>> 0;
      const lo = msg.bitmapLo >>> 0;
      for (let bit = 0; bit < 64; bit++) {
        const seq = this.cumSeq + 1 + bit;
        if (seq >= totalChunks) break;
        const isSet = bit < 32 ? ((lo >>> bit) & 1) : ((hi >>> (bit - 32)) & 1);
        if (isSet && !this.acked[seq]) {
          this.acked[seq] = 1;
          creditSlot(seq, rttSample);
          if (seq > this.highestSacked) this.highestSacked = seq;
        }
      }

      if (this.cumSeq >= totalChunks - 1) {
        this.resolveDone();
      }
      if (this.wake) {
        const fn = this.wake;
        this.wake = null;
        fn();
      }
    }
  };
  txState.donePromise = new Promise((res, rej) => {
    txState.resolveDone = res;
    txState.rejectDone = rej;
  });
  outgoingTransfers.set(transferId, txState);

  try {
    await ensureConnected(10000);
    const fileStartPromise = sendControlMessage({
      type: "file-start",
      transferId,
      txSlot,
      name: file.name,
      size: file.size,
      mime: file.type || "application/octet-stream",
      chunkSize,
      totalChunks,
      saltB64: bytesToBase64(salt),
      deflateCapable: HAS_COMPRESSION_STREAMS
    }, startedOnP2P);
    if (startedOnP2P || totalChunks === 0) {
      await fileStartPromise;
    } else {
      await sleep(2);
    }

    if (totalChunks > 0) {
      const reader = createSlabReader(file, chunkSize);
      const retransmitSet = new Set();
      let nextSeq = 0;

      while (txState.cumSeq < totalChunks - 1) {
        if (!hasLiveTransport()) {
          await ensureConnected(15000);
        }

        // Seamless mid-file P2P cutover OR primary P2P 3-lane streaming
        if (hasOpenP2P()) {
          while (retransmitSet.size > 0 || nextSeq < totalChunks) {
            let lane = pickLowestBufferedP2PLane();
            while (!lane || (lane.dataChannel && lane.dataChannel.bufferedAmount >= P2P_HIGH_WATER)) {
              if (!hasOpenP2P()) break;
              await waitForAnyP2PLaneLow();
              lane = pickLowestBufferedP2PLane();
            }
            if (!lane || !lane.open) break;

            let seqToSend;
            if (retransmitSet.size > 0) {
              seqToSend = retransmitSet.values().next().value;
              retransmitSet.delete(seqToSend);
            } else {
              while (nextSeq < totalChunks && txState.acked[nextSeq]) nextSeq++;
              if (nextSeq >= totalChunks) break;
              seqToSend = nextSeq++;
            }

            let chunkBytes = reader.getChunkSync(seqToSend);
            if (!chunkBytes) chunkBytes = await reader.getChunk(seqToSend);
            const { frameType, body } = await prepareOutgoingPayload(chunkBytes, HAS_COMPRESSION_STREAMS);

            const gen = txState.txCount[seqToSend]++;
            const ts = nowMs();
            txState.sentAt[seqToSend] = ts;
            lane.send(buildP2PChunkFrame(frameType, seqToSend, body, Math.floor(ts), gen, txSlot));

            const doneBytes = Math.min(file.size, Math.max(nextSeq, txState.cumSeq + 1) * chunkSize);
            scheduleSendUi(file.name, doneBytes, file.size, startedAt);
          }

          if (txState.cumSeq >= totalChunks - 1) break;
        }

        // Uncapped Dual-Broker ECF Relay Pipeline with Entropy-Adaptive Compression
        if (!hasOpenP2P() && isRelayReady && hasAnyMqttReady()) {
          const now = nowMs();

          const rackLimit = Math.min(nextSeq - 1, txState.highestSacked - 3);
          for (let s = txState.cumSeq + 1; s <= rackLimit; s++) {
            if (!txState.acked[s] && txState.sentAt[s] > 0) {
              const sid = txState.sentSlot[s];
              const minWait = sid >= 0 ? Math.max(35, brokerSlots[sid].minRtt * 0.45) : 50;
              if (now - txState.sentAt[s] > minWait) {
                retransmitSet.add(s);
              }
            }
          }

          if (nextSeq >= totalChunks) {
            const unackedTail = [];
            for (let s = txState.cumSeq + 1; s < totalChunks; s++) {
              if (!txState.acked[s]) unackedTail.push(s);
            }
            if (unackedTail.length > 0 && unackedTail.length <= 4 && getReadyBrokers().length > 1) {
              for (const s of unackedTail) {
                if (!txState.tailCloned[s] && now - txState.sentAt[s] > 25) {
                  txState.tailCloned[s] = 1;
                  retransmitSet.add(s);
                }
              }
            }
            for (const s of unackedTail) {
              const sid = txState.sentSlot[s];
              const tailRto = sid >= 0 ? Math.max(220, brokerSlots[sid].ewmaRtt * 1.7) : 260;
              if (txState.sentAt[s] > 0 && now - txState.sentAt[s] > tailRto) {
                retransmitSet.add(s);
              }
            }
          }

          const batchPromises = [];
          while (retransmitSet.size > 0 || nextSeq < totalChunks) {
            let seqToSend;
            let isRetry = false;
            if (retransmitSet.size > 0) {
              seqToSend = retransmitSet.values().next().value;
              retransmitSet.delete(seqToSend);
              isRetry = true;
            } else {
              while (nextSeq < totalChunks && txState.acked[nextSeq]) nextSeq++;
              if (nextSeq >= totalChunks) break;
              seqToSend = nextSeq;
            }

            const excludeSid = isRetry ? txState.sentSlot[seqToSend] : -1;
            const slot = pickEcfBrokerSlot(excludeSid) || (isRetry ? pickEcfBrokerSlot(-1) : null);
            if (!slot) break;

            if (!isRetry) nextSeq += 1;
            else {
              const prevSid = txState.sentSlot[seqToSend];
              if (prevSid >= 0 && prevSid < brokerSlots.length) {
                if (localSlotInflight[prevSid] > 0) {
                  localSlotInflight[prevSid] -= 1;
                  brokerSlots[prevSid].inflight = Math.max(0, brokerSlots[prevSid].inflight - 1);
                }
                if (!txState.tailCloned[seqToSend]) {
                  brokerSlots[prevSid].inflightHi = Math.max(12, Math.floor(brokerSlots[prevSid].cwnd * 0.85));
                }
              }
            }

            let chunkBytes = reader.getChunkSync(seqToSend);
            if (!chunkBytes) chunkBytes = await reader.getChunk(seqToSend);

            const gen = txState.txCount[seqToSend]++;
            const ts = nowMs();
            txState.sentAt[seqToSend] = ts;
            txState.sentSlot[seqToSend] = slot.id;
            slot.inflight += 1;
            localSlotInflight[slot.id] += 1;

            const p = prepareOutgoingPayload(chunkBytes, HAS_COMPRESSION_STREAMS)
              .then(({ frameType, body }) => encryptChunkWithXorNonce(salt, frameType, seqToSend, Math.floor(ts), gen, txSlot, body))
              .then((pkt) => mqttPublishSlot(slot, relayOutTopic, pkt, { qos: 0 }))
              .catch(() => {
                if (localSlotInflight[slot.id] > 0) {
                  localSlotInflight[slot.id] -= 1;
                  slot.inflight = Math.max(0, slot.inflight - 1);
                }
              });
            batchPromises.push(p);
          }

          if (batchPromises.length > 0) {
            await Promise.all(batchPromises);
            const estBytes = Math.min(file.size, Math.max(nextSeq, txState.cumSeq + 1) * chunkSize);
            scheduleSendUi(file.name, estBytes, file.size, startedAt);
            if (txState.cumSeq >= totalChunks - 1) break;
            if (pickEcfBrokerSlot(-1) && (retransmitSet.size > 0 || nextSeq < totalChunks)) {
              continue;
            }
          }
        }

        if (txState.cumSeq >= totalChunks - 1) break;

        await new Promise((resolve) => {
          const t = setTimeout(() => {
            if (txState.wake === resolve) txState.wake = null;
            resolve();
          }, 25);
          txState.wake = () => {
            clearTimeout(t);
            resolve();
          };
        });
      }
    }

    await ensureConnected(10000);
    await fileStartPromise;
    await sendControlMessage({ type: "file-end", transferId }, hasOpenP2P());
    scheduleSendUi(file.name, file.size, file.size, startedAt);
  } finally {
    for (let i = 0; i < brokerSlots.length; i++) {
      brokerSlots[i].inflight = Math.max(0, brokerSlots[i].inflight - localSlotInflight[i]);
    }
    outgoingTransfers.delete(transferId);
  }
}

// === Framed File Receiving (Progressive 4 MB Sub-Blob Compaction + Async Decode Gate) ===
function handleEncryptedRelayPacket(rawPayload) {
  if (!sharedAesKey || !rawPayload || rawPayload.byteLength < 2) return;
  const bytes = new Uint8Array(rawPayload.buffer, rawPayload.byteOffset, rawPayload.byteLength);
  const frameType = bytes[0];

  if (frameType === 0x01) {
    relayCtrlChain = relayCtrlChain
      .then(async () => {
        const plain = await decryptControlPacket(bytes);
        const jsonStart = plain[0] === 0x01 ? 1 : 0;
        await handleControlJson(JSON.parse(textDecoder.decode(plain.subarray(jsonStart))), "relay");
        drainEarlyRelayChunks();
      })
      .catch(() => {});
    return;
  }

  if (frameType === 0x02 || frameType === 0x03 || frameType === 0x04) {
    if (bytes.length < 11) return;
    const txSlot = bytes[10];
    const transferId = txSlotMap.get(txSlot);
    const state = transferId ? incomingTransfers.get(transferId) : getRecvState(null);
    if (!state || !state.salt) {
      earlyRelayChunks.push(bytes.slice());
      return;
    }
    decodeEncryptedDataPacket(state, bytes, "relay");
  }
}

function decodeEncryptedDataPacket(state, bytes, transport) {
  state.pendingDecodes += 1;
  decryptChunkWithXorNonce(state.salt, bytes)
    .then(({ frameType, seq, sentMs32, body }) => decodeBodyAndApply(state, frameType, seq, sentMs32, body, transport))
    .catch(() => {})
    .finally(() => {
      state.pendingDecodes -= 1;
      if (state.pendingDecodes === 0 && state.decodeDrainResolve) {
        const fn = state.decodeDrainResolve;
        state.decodeDrainResolve = null;
        fn();
      }
    });
}

function drainEarlyRelayChunks() {
  if (earlyRelayChunks.length === 0) return;
  const remaining = [];
  while (earlyRelayChunks.length > 0) {
    const bytes = earlyRelayChunks.shift();
    const txSlot = bytes[10];
    const transferId = txSlotMap.get(txSlot);
    const state = transferId ? incomingTransfers.get(transferId) : getRecvState(null);
    if (!state || !state.salt) {
      remaining.push(bytes);
      continue;
    }
    decodeEncryptedDataPacket(state, bytes, "relay");
  }
  for (const r of remaining) earlyRelayChunks.push(r);
}

function handleP2PRawPacket(bytes) {
  if (!bytes || bytes.length === 0) return;
  const frameType = bytes[0];

  if (frameType === 0x01) {
    const msg = JSON.parse(textDecoder.decode(bytes.subarray(1)));
    handleControlJson(msg, "p2p");
    return;
  }

  if (frameType === 0x02 || frameType === 0x03 || frameType === 0x04) {
    if (bytes.length < 11) return;
    const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
    const seq = view.getUint32(1, false);
    const sentMs32 = view.getUint32(5, false);
    const txSlot = bytes[10];
    const transferId = txSlotMap.get(txSlot);
    const state = transferId ? incomingTransfers.get(transferId) : getRecvState(null);
    if (!state) return;
    const body = bytes.slice(11);
    if (frameType === 0x02 || frameType === 0x04) {
      decodeBodyAndApply(state, frameType, seq, sentMs32, body, "p2p");
    } else {
      state.pendingDecodes += 1;
      decodeBodyAndApply(state, frameType, seq, sentMs32, body, "p2p")
        .finally(() => {
          state.pendingDecodes -= 1;
          if (state.pendingDecodes === 0 && state.decodeDrainResolve) {
            const fn = state.decodeDrainResolve;
            state.decodeDrainResolve = null;
            fn();
          }
        });
    }
  }
}

async function decodeBodyAndApply(state, frameType, seq, sentMs32, body, transport) {
  if (!state || state.finalized || seq >= state.totalChunks) return;
  let chunk;
  if (frameType === 0x02) {
    chunk = body;
  } else if (frameType === 0x03) {
    chunk = await runStreamTransform(body, DecompressionStream);
  } else if (frameType === 0x04) {
    if (body.length < 5) return;
    const fillByte = body[0];
    const len = new DataView(body.buffer, body.byteOffset, body.byteLength).getUint32(1, false);
    chunk = new Uint8Array(len);
    if (fillByte !== 0) chunk.fill(fillByte);
  } else {
    return;
  }
  handleDecodedChunk(state, seq, sentMs32, chunk, transport);
}

function getRecvState(transferId) {
  if (transferId && incomingTransfers.has(transferId)) return incomingTransfers.get(transferId);
  if (legacyRecvId && incomingTransfers.has(legacyRecvId)) return incomingTransfers.get(legacyRecvId);
  return null;
}

function hasRecvBit(state, seq) {
  if (seq < 0 || seq >= state.totalChunks) return false;
  return (state.bitmap[seq >>> 3] & (1 << (seq & 7))) !== 0;
}

function setRecvBit(state, seq) {
  state.bitmap[seq >>> 3] |= (1 << (seq & 7));
}

function compactContiguousPrefix(state) {
  while (state.cumSeq - state.compactWatermark + 1 >= COMPACT_CHUNK_BATCH) {
    const end = state.compactWatermark + COMPACT_CHUNK_BATCH;
    const slice = [];
    for (let i = state.compactWatermark; i < end; i++) {
      if (state.chunks[i]) {
        slice.push(state.chunks[i]);
        state.chunks[i] = null;
      }
    }
    if (slice.length > 0) {
      state.compactedBlobs.push(new Blob(slice));
    }
    state.compactWatermark = end;
  }
}

function emitSack(state, transport) {
  const now = nowMs();
  let lo = 0;
  let hi = 0;
  for (let bit = 0; bit < 64; bit++) {
    const s = state.cumSeq + 1 + bit;
    if (s >= state.totalChunks) break;
    if (hasRecvBit(state, s)) {
      if (bit < 32) lo |= (1 << bit);
      else hi |= (1 << (bit - 32));
    }
  }
  state.lastSackAt = now;
  sendControlMessage({
    type: "sack",
    transferId: state.meta.transferId,
    cumSeq: state.cumSeq,
    bitmapHi: hi >>> 0,
    bitmapLo: lo >>> 0,
    echoTs: state.lastSenderTs || 0
  }, transport === "p2p");
}

async function handleControlJson(msg, transport) {
  if (msg.type === "sack" || msg.type === "chunk-ack") {
    const tx = outgoingTransfers.get(msg.transferId);
    if (tx && typeof tx.onSack === "function") {
      tx.onSack(msg);
    } else if (tx && tx.resolveDone) {
      tx.resolveDone();
    }
    return;
  }

  if (msg.type === "resume-query") {
    const state = incomingTransfers.get(msg.transferId);
    if (state) emitSack(state, transport);
    return;
  }

  if (msg.type === "file-start") {
    if (incomingTransfers.has(msg.transferId)) return;
    const totalChunks = typeof msg.totalChunks === "number"
      ? msg.totalChunks
      : (msg.size === 0 ? 0 : Math.ceil(msg.size / (msg.chunkSize || RELAY_CHUNK_SIZE)));
    const state = {
      meta: msg,
      salt: msg.saltB64 ? base64ToBytes(msg.saltB64) : null,
      totalChunks,
      chunks: new Array(totalChunks),
      compactedBlobs: [],
      compactWatermark: 0,
      bitmap: new Uint8Array(Math.ceil(totalChunks / 8)),
      receivedCount: 0,
      receivedBytes: 0,
      cumSeq: -1,
      pendingDecodes: 0,
      decodeDrainResolve: null,
      startedAt: nowMs(),
      lastSackAt: 0,
      lastSenderTs: 0,
      sinceSack: 0,
      finalized: false
    };
    incomingTransfers.set(msg.transferId, state);
    if (typeof msg.txSlot === "number") txSlotMap.set(msg.txSlot, msg.transferId);
    legacyRecvId = msg.transferId;

    document.getElementById("recvProgressBox").style.display = "block";
    scheduleRecvUi(msg.name, 0, msg.size, state.startedAt);
    return;
  }

  if (msg.type === "file-end") {
    const state = getRecvState(msg.transferId);
    if (!state || state.finalized) return;
    if (state.pendingDecodes > 0) {
      await new Promise((resolve) => { state.decodeDrainResolve = resolve; });
    }
    if (state.finalized) return;
    state.finalized = true;

    const parts = state.compactedBlobs.slice();
    for (let i = state.compactWatermark; i < state.totalChunks; i++) {
      if (state.chunks[i]) {
        parts.push(state.chunks[i]);
        state.chunks[i] = null;
      }
    }
    const blob = new Blob(parts, { type: state.meta.mime || "application/octet-stream" });
    addFileToList(state.meta.name, state.meta.size, state.meta.mime, blob, "受信");

    incomingTransfers.delete(state.meta.transferId);
    if (typeof state.meta.txSlot === "number" && txSlotMap.get(state.meta.txSlot) === state.meta.transferId) {
      txSlotMap.delete(state.meta.txSlot);
    }
    if (legacyRecvId === state.meta.transferId) legacyRecvId = null;

    scheduleRecvUi(state.meta.name, state.meta.size, state.meta.size, state.startedAt);
    setTimeout(() => { document.getElementById("recvProgressBox").style.display = "none"; }, 1400);
  }
}

function handleDecodedChunk(state, seq, sentMs32, chunk, transport) {
  if (!state || state.finalized || seq >= state.totalChunks) return;
  if (sentMs32 > 0) state.lastSenderTs = sentMs32;
  const outOfOrder = seq > state.cumSeq + 1;

  if (!hasRecvBit(state, seq)) {
    state.chunks[seq] = chunk;
    setRecvBit(state, seq);
    state.receivedCount += 1;
    state.receivedBytes += chunk.byteLength;
    while (hasRecvBit(state, state.cumSeq + 1)) {
      state.cumSeq += 1;
    }
    compactContiguousPrefix(state);
    scheduleRecvUi(state.meta.name, state.receivedBytes, state.meta.size, state.startedAt);
  }

  state.sinceSack += 1;
  const now = nowMs();
  if (
    state.receivedCount >= state.totalChunks ||
    (outOfOrder && now - state.lastSackAt > 12) ||
    (state.sinceSack >= SACK_INTERVAL && now - state.lastSackAt > 4)
  ) {
    state.sinceSack = 0;
    emitSack(state, transport);
  }
}

// === History & iOS Share / Save ===
function formatFileSize(bytes) {
  if (bytes < 1024) return `${bytes} B`;
  if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
  return `${(bytes / (1024 * 1024)).toFixed(2)} MB`;
}

function createSvgIcon(symbolId, size = 15) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("class", "svg-icon");
  svg.setAttribute("width", String(size));
  svg.setAttribute("height", String(size));
  svg.setAttribute("aria-hidden", "true");
  const use = document.createElementNS("http://www.w3.org/2000/svg", "use");
  use.setAttribute("href", `#${symbolId}`);
  svg.append(use);
  return svg;
}

function addFileToList(name, size, mime, blob, statusLabel) {
  document.getElementById("historyCard").classList.remove("hidden");
  const list = document.getElementById("fileList");

  const li = document.createElement("li");
  li.className = "file-item";

  const url = URL.createObjectURL(blob);
  const isImage = mime && mime.startsWith("image/");

  const header = document.createElement("div");
  header.className = "file-header";

  const info = document.createElement("div");
  info.className = "file-info";
  const nameDiv = document.createElement("div");
  nameDiv.className = "file-name";
  nameDiv.textContent = name;
  const metaDiv = document.createElement("div");
  metaDiv.className = "file-meta";
  metaDiv.textContent = `${statusLabel} · ${formatFileSize(size)}`;
  info.append(nameDiv, metaDiv);

  const actions = document.createElement("div");
  actions.className = "file-actions";

  let shareFile = null;
  try {
    shareFile = new File([blob], name, { type: mime || "application/octet-stream" });
  } catch {}

  if (shareFile && navigator.canShare && navigator.canShare({ files: [shareFile] })) {
    const shareBtn = document.createElement("button");
    shareBtn.type = "button";
    shareBtn.className = "share-file-btn";
    shareBtn.setAttribute("aria-label", `${name} を共有`);
    shareBtn.append(createSvgIcon("icon-share", 14), document.createTextNode("共有"));
    shareBtn.addEventListener("click", async () => {
      try {
        await navigator.share({ files: [shareFile], title: name });
      } catch {}
    });
    actions.append(shareBtn);
  }

  const dlLink = document.createElement("a");
  dlLink.href = url;
  dlLink.download = name;
  dlLink.className = "dl-btn";
  dlLink.setAttribute("aria-label", `${name} を保存`);
  dlLink.append(createSvgIcon("icon-download", 14), document.createTextNode("保存"));
  actions.append(dlLink);

  header.append(info, actions);
  li.append(header);

  if (isImage) {
    const img = document.createElement("img");
    img.src = url;
    img.className = "preview-img";
    img.alt = name;
    li.append(img);
  }

  list.prepend(li);
}

// === UI Events & Copy Helper ===
function legacyCopy(text) {
  const previousFocus = document.activeElement;
  const field = Object.assign(document.createElement("textarea"), { value: text });
  field.setAttribute("readonly", "");
  field.style.cssText = "position:fixed;inset-block-start:0;opacity:0";
  document.body.append(field);
  field.select();
  try {
    return document.execCommand("copy");
  } finally {
    field.remove();
    previousFocus?.focus({ preventScroll: true });
  }
}

function showCopyTip(message, ok) {
  const btn = document.getElementById("copyCodeBtn");
  const tip = document.getElementById("copyTip");
  clearTimeout(copyTipTimer);
  let text = message;
  if (text === lastCopyMessage) text += "\u00A0";
  lastCopyMessage = message;
  if (ok) btn.setAttribute("data-copied", "");
  else btn.removeAttribute("data-copied");
  tip.textContent = "";
  tip.classList.add("is-visible");
  requestAnimationFrame(() => { tip.textContent = text; });
  copyTipTimer = setTimeout(() => {
    btn.removeAttribute("data-copied");
    tip.classList.remove("is-visible");
    tip.textContent = "";
  }, 1800);
}

function setupUIEvents() {
  const targetInput = document.getElementById("targetId");
  const connectBtn = document.getElementById("connectBtn");
  const cancelBtn = document.getElementById("cancelConnectBtn");
  const reconnectBtn = document.getElementById("reconnectBtn");
  const disconnectBtn = document.getElementById("disconnectBtn");
  const copyCodeBtn = document.getElementById("copyCodeBtn");
  const shareLinkBtn = document.getElementById("shareLinkBtn");

  if (navigator.share) {
    shareLinkBtn.classList.remove("hidden");
    shareLinkBtn.addEventListener("click", async () => {
      const url = `${window.location.origin}${window.location.pathname}?connect=${myId}`;
      try {
        await navigator.share({ title: "AirShare", text: `コード: ${myId}`, url });
      } catch {}
    });
  }

  copyCodeBtn.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(myId);
      showCopyTip("コピーしました", true);
    } catch {
      const ok = legacyCopy(myId);
      showCopyTip(ok ? "コピーしました" : "コピー失敗", ok);
    }
  });

  targetInput.addEventListener("input", () => {
    const cleaned = normalizeCode(targetInput.value);
    if (targetInput.value !== cleaned) {
      targetInput.value = cleaned;
    }
  });

  connectBtn.addEventListener("click", () => {
    connectToPeer(targetInput.value);
  });

  cancelBtn.addEventListener("click", () => {
    cancelPendingConnection("キャンセルしました", false);
  });

  reconnectBtn.addEventListener("click", () => {
    wakeTransports();
    startAutoReconnect(true);
  });

  disconnectBtn.addEventListener("click", () => {
    if (pairedPeerId && hasAnyMqttReady()) {
      publishOnBestBroker(`lanp2p-v2/inbox/${pairedPeerId}`, JSON.stringify({ kind: "bye", from: myId }), { qos: 1 }).catch(() => {});
    }
    resetToConnectPanel("切断しました");
  });

  targetInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      connectBtn.click();
    }
  });

  const dropZone = document.getElementById("dropZone");
  const fileInput = document.getElementById("fileInput");

  dropZone.addEventListener("click", () => fileInput.click());
  dropZone.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      fileInput.click();
    }
  });

  fileInput.addEventListener("change", (e) => {
    if (e.target.files.length > 0) {
      sendFiles(e.target.files, () => {
        fileInput.value = "";
      });
    }
  });

  dropZone.addEventListener("dragover", (e) => {
    e.preventDefault();
    dropZone.classList.add("dragover");
  });
  dropZone.addEventListener("dragleave", () => dropZone.classList.remove("dragover"));
  dropZone.addEventListener("drop", (e) => {
    e.preventDefault();
    dropZone.classList.remove("dragover");
    if (e.dataTransfer.files.length > 0) sendFiles(e.dataTransfer.files);
  });
}
